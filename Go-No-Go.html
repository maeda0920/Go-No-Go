<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>Go/No-Go Task</title>

<script src="https://unpkg.com/jspsych@8.2.2"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>

<link
  href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css"
  rel="stylesheet"
/>

<style>

body {
  background: white;
  color: black;
  font-family: Arial, sans-serif;
}

  font-size: 23px;
  line-height: 1.7;
  max-width: 900px;
  margin: auto;
  text-align: center;
}

  font-weight: bold;
}

  margin: 20px auto;
  border-collapse: collapse;

}

select,
input {
  font-size: 21px;

</style>

</head>

<body></body>

<script>


/* =========================================================
   1. 基本設定
========================================================= */

const FIXATION_DURATION = 250;

const STIMULUS_DURATION = 500;

const PRACTICE_GO = 7;

const PRACTICE_NOGO = 3;

const MAIN_GO = 70;

const MAIN_NOGO = 30;

const BREAK_DURATION = 60000;


/* =========================================================
   2. 測定時点
========================================================= */

const TIMEPOINTS = [

  {
    code: "T1",
    ja: "介入前 Baseline",
    en: "Pre-intervention Baseline"
  },

  {
    code: "T2",
    ja: "介入4週間後",
    en: "Week 4 of Intervention"
  },

  {
    code: "T3",
    ja: "介入8週間後",
    en: "Week 8 of Intervention"
  },

  {
    code: "T4",
    ja: "Washout後 Baseline",
    en: "Post-washout Baseline"
  },

  {
    code: "T5",
    ja: "Washout後4週間後",
    en: "Week 4 After Post-washout Baseline"
  },

  {
    code: "T6",
    ja: "Washout後8週間後",
    en: "Week 8 After Post-washout Baseline"
  }

];


/* =========================================================
   3. 変数
========================================================= */

let language = "ja";

let participant_id = "";

let selectedTimepointIndex = 0;

let selectedTimepoint = null;

let experiment_date = "";


/* =========================================================
   4. 言語切替
========================================================= */

function t(ja, en) {

  return language === "en"
    ? en
    : ja;
}


function timepointName(tp) {

  return language === "en"
    ? tp.en
    : tp.ja;
}


/* =========================================================
   5. 基本統計
========================================================= */

function mean(values) {

  if (values.length === 0) {
    return NaN;
  }

  return values.reduce(
    (a,b) => a+b,
    0
  ) / values.length;
}


function median(values) {

  if (values.length === 0) {
    return NaN;
  }

  const sorted =
    [...values].sort(
      (a,b) => a-b
    );

  const middle =
    Math.floor(
      sorted.length / 2
    );

  if (sorted.length % 2 === 0) {

    return (
      sorted[middle - 1]
      +
      sorted[middle]
    ) / 2;
  }

  return sorted[middle];
}


function sd(values) {

  if (values.length < 2) {
    return NaN;
  }

  const m =
    mean(values);

  return Math.sqrt(

    values.reduce(
      (sum,x) =>
        sum +
        Math.pow(
          x-m,
          2
        ),
      0
    )

    /

    (values.length-1)

  );
}


function format(
  value,
  digits = 1
) {

  if (!Number.isFinite(value)) {
    return "";
  }

  return Number(value)
    .toFixed(digits);
}


/* =========================================================
   6. inverse normal CDF
   d-prime計算用
========================================================= */

function normInv(p) {

  if (
    p <= 0 ||
    p >= 1
  ) {
    return NaN;
  }


  const a = [
    -3.969683028665376e+01,
     2.209460984245205e+02,
    -2.759285104469687e+02,
     1.383577518672690e+02,
    -3.066479806614716e+01,
     2.506628277459239e+00
  ];


  const b = [
    -5.447609879822406e+01,
     1.615858368580409e+02,
    -1.556989798598866e+02,
     6.680131188771972e+01,
    -1.328068155288572e+01
  ];


  const c = [
    -7.784894002430293e-03,
    -3.223964580411365e-01,
    -2.400758277161838e+00,
    -2.549732539343734e+00,
     4.374664141464968e+00,
     2.938163982698783e+00
  ];


  const d = [
     7.784695709041462e-03,
     3.224671290700398e-01,
     2.445134137142996e+00,
     3.754408661907416e+00
  ];


  const plow = 0.02425;

  const phigh = 1 - plow;

  let q;

  let r;


  if (p < plow) {

    q =
      Math.sqrt(
        -2 *
        Math.log(p)
      );

    return (
      (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])
      /
      ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)
    );
  }


  if (p > phigh) {

    q =
      Math.sqrt(
        -2 *
        Math.log(1-p)
      );

    return -(
      (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])
      /
      ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)
    );
  }


  q =
    p - 0.5;

  r =
    q*q;


  return (
    (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q
    /
    (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)
  );

}


/* =========================================================
   7. 集計
========================================================= */

function calculateSummary(
  block = null
) {

  let data =
    jsPsych.data
      .get()
      .filter({
        task: "go_nogo",
        mode: "main"
      })
      .values();


  if (block !== null) {

    data =
      data.filter(
        d =>
          d.block === block
      );
  }


  const goData =
    data.filter(
      d =>
        d.stimulus_type === "go"
    );


  const nogoData =
    data.filter(
      d =>
        d.stimulus_type === "nogo"
    );


  const allGoResponses =
    goData.filter(
      d =>
        d.rt !== null
    );


  /*
    150～1000 msを
    RT解析対象とする
  */

  const validGoRT =
    allGoResponses

      .filter(
        d =>
          d.rt >= 150
          &&
          d.rt <= 1000
      )

      .map(
        d => d.rt
      );


  const excludedRTCount =
    allGoResponses.length
    -
    validGoRT.length;


  const goCorrect =
    goData.filter(
      d =>
        d.correct === true
    ).length;


  const nogoCorrect =
    nogoData.filter(
      d =>
        d.correct === true
    ).length;


  const omission =
    goData.filter(
      d =>
        d.error_type === "omission"
    ).length;


  const commission =
    nogoData.filter(
      d =>
        d.error_type === "commission"
    ).length;


  const goAccuracy =
    goData.length > 0
    ?
    goCorrect / goData.length
    :
    NaN;


  const nogoAccuracy =
    nogoData.length > 0
    ?
    nogoCorrect / nogoData.length
    :
    NaN;


  const commissionRate =
    nogoData.length > 0
    ?
    commission / nogoData.length
    :
    NaN;


  const omissionRate =
    goData.length > 0
    ?
    omission / goData.length
    :
    NaN;


  const totalCorrect =
    goCorrect +
    nogoCorrect;


  const overallAccuracy =
    data.length > 0
    ?
    totalCorrect / data.length
    :
    NaN;


  /*
    Signal Detection Theory

    Hit = Goへの正反応
    False Alarm = No-Goへの誤反応
  */

  let correctedHitRate =
    goAccuracy;


  let correctedFARate =
    commissionRate;


  if (goData.length > 0) {

    if (correctedHitRate === 1) {

      correctedHitRate =
        1 -
        (
          0.5 /
          goData.length
        );
    }

    else if (
      correctedHitRate === 0
    ) {

      correctedHitRate =
        0.5 /
        goData.length;
    }

  }


  if (nogoData.length > 0) {

    if (
      correctedFARate === 1
    ) {

      correctedFARate =
        1 -
        (
          0.5 /
          nogoData.length
        );
    }

    else if (
      correctedFARate === 0
    ) {

      correctedFARate =
        0.5 /
        nogoData.length;
    }

  }


  let dprime =
    NaN;


  let beta =
    NaN;


  if (
    Number.isFinite(
      correctedHitRate
    )
    &&
    Number.isFinite(
      correctedFARate
    )
  ) {

    const zHit =
      normInv(
        correctedHitRate
      );


    const zFA =
      normInv(
        correctedFARate
      );


    dprime =
      zHit -
      zFA;


    beta =
      Math.exp(

        (
          Math.pow(
            zFA,
            2
          )

          -

          Math.pow(
            zHit,
            2
          )
        )

        / 2

      );

  }


  return {

    total_trials:
      data.length,

    go_trials:
      goData.length,

    nogo_trials:
      nogoData.length,

    go_correct:
      goCorrect,

    nogo_correct:
      nogoCorrect,

    go_accuracy:
      goAccuracy,

    nogo_accuracy:
      nogoAccuracy,

    omission_count:
      omission,

    omission_rate:
      omissionRate,

    commission_count:
      commission,

    commission_rate:
      commissionRate,

    overall_accuracy:
      overallAccuracy,

    valid_rt_count:
      validGoRT.length,

    excluded_rt_count:
      excludedRTCount,

    mean_rt:
      mean(
        validGoRT
      ),

    median_rt:
      median(
        validGoRT
      ),

    min_rt:
      validGoRT.length > 0
      ?
      Math.min(...validGoRT)
      :
      NaN,

    max_rt:
      validGoRT.length > 0
      ?
      Math.max(...validGoRT)
      :
      NaN,

    sd_rt:
      sd(
        validGoRT
      ),

    se_rt:
      validGoRT.length > 0
      ?
      sd(validGoRT)
      /
      Math.sqrt(
        validGoRT.length
      )
      :
      NaN,

    cv_rt:
      Number.isFinite(
        mean(validGoRT)
      )
      &&
      mean(validGoRT) !== 0
      ?
      sd(validGoRT)
      /
      mean(validGoRT)
      :
      NaN,

    corrected_hit_rate:
      correctedHitRate,

    corrected_fa_rate:
      correctedFARate,

    dprime:
      dprime,

    beta:
      beta

  };

}


/* =========================================================
   8. CSV escape
========================================================= */

function csvEscape(value) {

  if (
    value === null
    ||
    value === undefined
  ) {

    return "";
  }


  const text =
    String(value);


  if (
    text.includes(",")
    ||
    text.includes('"')
    ||
    text.includes("\n")
  ) {

    return (
      '"'
      +
      text.replace(
        /"/g,
        '""'
      )
      +
      '"'
    );
  }


  return text;
}


/* =========================================================
   9. jsPsych初期化
========================================================= */

const jsPsych =
  initJsPsych({

    on_finish:
    function() {


      const r1 =
        calculateSummary(1);


      const r2 =
        calculateSummary(2);


      const overall =
        calculateSummary();


      let csv = "";


      /* ===================================================
         Basic Information
      =================================================== */

      csv +=
        "===== 基本情報 / Basic Information =====\n";


      csv +=
        "被験者ID / Participant ID,"
        +
        csvEscape(
          participant_id
        )
        +
        "\n";


      csv +=
        "言語 / Language,"
        +
        (
          language === "en"
          ?
          "English"
          :
          "Japanese"
        )
        +
        "\n";


      csv +=
        "測定時点コード / Time Point Code,"
        +
        selectedTimepoint.code
        +
        "\n";


      csv +=
        "測定時点 / Measurement Time Point,"
        +
        csvEscape(
          timepointName(
            selectedTimepoint
          )
        )
        +
        "\n";


      csv +=
        "実施日時 / Date and Time,"
        +
        csvEscape(
          experiment_date
        )
        +
        "\n";


      csv +=
        "Task,Go/No-Go\n";


      csv +=
        "Practice Trials,10\n";


      csv +=
        "Main Trials per Block,100\n";


      csv +=
        "Go Trials per Block,70\n";


      csv +=
        "No-Go Trials per Block,30\n";


      csv +=
        "Fixation Duration (ms),"
        +
        FIXATION_DURATION
        +
        "\n";


      csv +=
        "Stimulus Duration (ms),"
        +
        STIMULUS_DURATION
        +
        "\n";


      csv +=
        "Break Duration (s),60\n";


      /* ===================================================
         Trial-level data
      =================================================== */

      csv +=
        "\n===== Trial-level Data =====\n";


      csv +=
        "Participant_ID,Timepoint,Mode,Block,Trial_Number,Stimulus_Type,Color,RT_ms,Correct,Error_Type\n";


      const allData =
        jsPsych.data
          .get()
          .filter({
            task: "go_nogo"
          })
          .values();


      allData.forEach(
        d => {


          csv += [

            participant_id,

            selectedTimepoint.code,

            d.mode,

            d.block,

            d.trial_number,

            d.stimulus_type,

            d.color,

            d.rt ?? "",

            d.correct ?? "",

            d.error_type ?? ""

          ]

          .map(
            csvEscape
          )

          .join(",")

          +

          "\n";

        }
      );


      /* ===================================================
         Summary
      =================================================== */

      function addSummary(
        title,
        r
      ) {


        csv +=
          "\n===== "
          +
          title
          +
          " =====\n";


        csv +=
          "Total Trials,"
          +
          r.total_trials
          +
          "\n";


        csv +=
          "Go Trials,"
          +
          r.go_trials
          +
          "\n";


        csv +=
          "No-Go Trials,"
          +
          r.nogo_trials
          +
          "\n";


        csv +=
          "Go Correct,"
          +
          r.go_correct
          +
          "\n";


        csv +=
          "No-Go Correct,"
          +
          r.nogo_correct
          +
          "\n";


        csv +=
          "Go Accuracy (%),"
          +
          format(
            r.go_accuracy * 100,
            1
          )
          +
          "\n";


        csv +=
          "No-Go Accuracy (%),"
          +
          format(
            r.nogo_accuracy * 100,
            1
          )
          +
          "\n";


        csv +=
          "Commission Errors,"
          +
          r.commission_count
          +
          "\n";


        csv +=
          "Commission Error Rate (%),"
          +
          format(
            r.commission_rate * 100,
            1
          )
          +
          "\n";


        csv +=
          "Omission Errors,"
          +
          r.omission_count
          +
          "\n";


        csv +=
          "Omission Error Rate (%),"
          +
          format(
            r.omission_rate * 100,
            1
          )
          +
          "\n";


        csv +=
          "Overall Accuracy (%),"
          +
          format(
            r.overall_accuracy * 100,
            1
          )
          +
          "\n";


        csv +=
          "Valid RT Count,"
          +
          r.valid_rt_count
          +
          "\n";


        csv +=
          "Excluded RT Count,"
          +
          r.excluded_rt_count
          +
          "\n";


        csv +=
          "Mean RT (ms),"
          +
          format(
            r.mean_rt,
            1
          )
          +
          "\n";


        csv +=
          "Median RT (ms),"
          +
          format(
            r.median_rt,
            1
          )
          +
          "\n";


        csv +=
          "Minimum RT (ms),"
          +
          format(
            r.min_rt,
            1
          )
          +
          "\n";


        csv +=
          "Maximum RT (ms),"
          +
          format(
            r.max_rt,
            1
          )
          +
          "\n";


        csv +=
          "RT Standard Deviation (ms),"
          +
          format(
            r.sd_rt,
            1
          )
          +
          "\n";


        csv +=
          "RT Standard Error (ms),"
          +
          format(
            r.se_rt,
            1
          )
          +
          "\n";


        csv +=
          "RT CV,"
          +
          format(
            r.cv_rt,
            3
          )
          +
          "\n";


        csv +=
          "Corrected Hit Rate,"
          +
          format(
            r.corrected_hit_rate,
            4
          )
          +
          "\n";


        csv +=
          "Corrected False Alarm Rate,"
          +
          format(
            r.corrected_fa_rate,
            4
          )
          +
          "\n";


        csv +=
          "d-prime,"
          +
          format(
            r.dprime,
            3
          )
          +
          "\n";


        csv +=
          "Beta,"
          +
          format(
            r.beta,
            3
          )
          +
          "\n";

      }


      addSummary(
        "Main Block 1",
        r1
      );


      addSummary(
        "Main Block 2",
        r2
      );


      addSummary(
        "Overall Main Task",
        overall
      );


      /* ===================================================
         CSV保存
      =================================================== */

      const bom =
        new Uint8Array([
          0xEF,
          0xBB,
          0xBF
        ]);


      const blob =
        new Blob(

          [
            bom,
            csv
          ],

          {
            type:
              "text/csv;charset=utf-8;"
          }

        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =

        participant_id
        +
        "_"
        +
        selectedTimepoint.code
        +
        "_GoNoGo_results.csv";


      document.body
        .appendChild(
          link
        );


      link.click();


      document.body
        .removeChild(
          link
        );


      URL.revokeObjectURL(
        url
      );

    }

  });


/* =========================================================
   10. Timeline
========================================================= */

const timeline = [];


/* =========================================================
   11. 言語・ID・測定時点入力
========================================================= */

timeline.push({

  type:
    jsPsychSurveyHtmlForm,


  html: `

    <div class="text">

      <h1>
        Go / No-Go Task
      </h1>


      <p>
        <strong>
          言語 / Language
        </strong>
      </p>


      <select
        name="language"
        required
      >

        <option value="ja">
          日本語
        </option>

        <option value="en">
          English
        </option>

      </select>


      <p>
        <strong>
          被験者ID / Participant ID
        </strong>
      </p>


      <input
        name="participant_id"
        type="text"
        placeholder="01 / 001"
        inputmode="numeric"
        maxlength="3"
        required
      >


      <p>
        <strong>
          測定時点 / Measurement Time Point
        </strong>
      </p>


      <select
        name="timepoint"
        required
      >

        <option value="0">
          T1：介入前 Baseline / Pre-intervention Baseline
        </option>

        <option value="1">
          T2：介入4週間後 / Week 4 of Intervention
        </option>

        <option value="2">
          T3：介入8週間後 / Week 8 of Intervention
        </option>

        <option value="3">
          T4：Washout後 Baseline / Post-washout Baseline
        </option>

        <option value="4">
          T5：Washout後4週間後 / Week 4 After Post-washout Baseline
        </option>

        <option value="5">
          T6：Washout後8週間後 / Week 8 After Post-washout Baseline
        </option>

      </select>

    </div>

  `,


  button_label:
    "開始 / Start",


  on_finish:
  function(data) {


    language =
      data.response.language;


    participant_id =
      String(
        data.response.participant_id
      ).trim();


    /*
      被験者ID：
      半角数字2～3桁
    */

    if (
      !/^\d{2,3}$/.test(
        participant_id
      )
    ) {

      alert(

        language === "en"

        ?

        "Participant ID must contain 2 or 3 digits (e.g., 01 or 001)."

        :

        "被験者IDは半角数字2桁または3桁で入力してください（例：01、001）。"

      );

    }


    selectedTimepointIndex =
      Number(
        data.response.timepoint
      );


    selectedTimepoint =
      TIMEPOINTS[
        selectedTimepointIndex
      ];


    experiment_date =
      new Date()
        .toLocaleString(
          "ja-JP"
        );


    document.documentElement.lang =
      language === "en"
      ?
      "en"
      :
      "ja";


    jsPsych.data.addProperties({

      participant_id:
        participant_id,

      language:
        language,

      measurement_code:
        selectedTimepoint.code,

      measurement_label:
        timepointName(
          selectedTimepoint
        ),

      date:
        experiment_date

    });

  }

});


/* =========================================================
   12. 説明
========================================================= */

timeline.push({

  type:
    jsPsychHtmlKeyboardResponse,


  stimulus:
  function() {

    return `

      <div class="text">

        <h2>
          ${t(
            "Go / No-Go 課題",
            "Go / No-Go Task"
          )}
        </h2>


        <p>

          ${t(
            "被験者ID",
            "Participant ID"
          )}:

          <strong>

/* =========================================================
   13. Fixation
========================================================= */

function makeFixation() {

  return {

    type:
      jsPsychHtmlKeyboardResponse,

    stimulus:
      '<div style="font-size:60px;">+</div>',

    choices:
      "NO_KEYS",

    trial_duration:
      FIXATION_DURATION

  };
}


/* =========================================================
   14. Go/No-Go Trial
========================================================= */

function makeTrial(
  stimulusType,
  color,
  mode,
  block,
  trialNumber
) {

  return {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus: `

      <div
        style="
          width:160px;
          height:160px;
          border-radius:50%;
          background-color:${color};
          margin:100px auto;
        "
      ></div>

    `,


    choices:
      [" "],


    trial_duration:
      STIMULUS_DURATION,


    response_ends_trial:
      false,


    data: {

      task:
        "go_nogo",

      mode:
        mode,

      block:
        block,

      trial_number:
        trialNumber,

      stimulus_type:
        stimulusType,

      color:
        color,

      stimulus_duration:
        STIMULUS_DURATION

    },


    on_finish:
    function(data) {


      if (
        stimulusType === "go"
      ) {

        data.correct =
          data.response !== null;

      }

      else {

        data.correct =
          data.response === null;

      }


      if (
        stimulusType === "go"
        &&
        data.response === null
      ) {

        data.error_type =
          "omission";

      }


      else if (
        stimulusType === "nogo"
        &&
        data.response !== null
      ) {

        data.error_type =
          "commission";

      }


      else {

        data.error_type =
          "none";

      }

    }

  };

}


/* =========================================================
   15. 刺激列
========================================================= */

function createTrialList(
  goCount,
  nogoCount
) {

  const trials = [];


  for (
    let i = 0;
    i < goCount;
    i++
  ) {

    trials.push([
      "go",
      "blue"
    ]);

  }


  for (
    let i = 0;
    i < nogoCount;
    i++
  ) {

    trials.push([
      "nogo",
      "red"
    ]);

  }


  return jsPsych.randomization
    .shuffle(
      trials
    );

}

/* =========================================================

========================================================= */

  stimulus:
  function() {

    return `

      <div class="text">

        <h2>

          ${t(
            "休憩",
            "Break"
          )}

        </h2>


        <p>

          ${t(
            "本試行1回目が終了しました。",

          )}

        <p>

          ${t(
            "60秒間休憩してください。",
            "Please take a 60-second break."
          )}

          id="rest-countdown"
          class="countdown"
        >
          60
        </div>


        <p>

          ${t(
            "秒",
            "seconds"
          )}

        </p>


        <p>

          ${t(
            "0秒になると自動的に次へ進みます。",
            "The task will continue automatically when the countdown reaches 0."
          )}

        </p>

      </div>

    `;

  },


  choices:
    "NO_KEYS",


  trial_duration:
    BREAK_DURATION,


  on_load:
  function() {


    let remaining =
      60;


    const timer =
      setInterval(
        function() {


          remaining--;


          const el =
            document.getElementById(
              "rest-countdown"
            );


          if (el) {

            el.textContent =
              Math.max(
                remaining,
                0
              );
          }


          if (
            remaining <= 0
          ) {

            clearInterval(
              timer
            );
          }

        },

        1000
      );


    window.goNoGoBreakTimer =
      timer;

  },


  on_finish:
  function() {

    if (
      window.goNoGoBreakTimer
    ) {

      clearInterval(
        window.goNoGoBreakTimer
      );


      window.goNoGoBreakTimer =
        null;
    }

  }

});
