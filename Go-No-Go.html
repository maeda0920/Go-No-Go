<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <title>Go No-Go Test</title>

  <script src="https://unpkg.com/jspsych@8.2.2"></script>

  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>

  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script>

  <link
    href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css"
    rel="stylesheet"
  >

  <style>

    body {
      background: white;
      color: black;
      font-family: Arial, sans-serif;
    }

    .text {
      font-size: 23px;
      line-height: 1.7;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    .countdown {
      font-size: 60px;
      font-weight: bold;
    }

  </style>

</head>


<body></body>


<script>


/* =========================================================
   1. 基本変数
========================================================= */

let participant_id = "";

let measurement_time = "";

let measurement_label = "";

let measurement_code = "";

let experiment_date = "";


/* =========================================================
   2. Timeline
========================================================= */

let timeline = [];


/* =========================================================
   3. jsPsych 初期化
========================================================= */

const jsPsych = initJsPsych({

  on_finish: function() {


    /* -----------------------------------------------------
       Go/No-Goデータ取得
    ----------------------------------------------------- */

    const all_data =
      jsPsych.data
        .get()
        .filter({
          task: "go_nogo"
        })
        .values();


    /*
      本試行だけ取得
      練習はsummaryから除外
    */

    const main_data =
      all_data.filter(
        d =>
          d.mode === "main"
      );


    const block1_data =
      main_data.filter(
        d =>
          d.block === 1
      );


    const block2_data =
      main_data.filter(
        d =>
          d.block === 2
      );


    /* =====================================================
       4. inverse normal CDF
       d-prime計算用
    ===================================================== */

    function normInv(p) {

      if (
        p <= 0 ||
        p >= 1
      ) {

        return NaN;
      }


      const a = [

        -3.969683028665376e+01,
         2.209460984245205e+02,
        -2.759285104469687e+02,
         1.383577518672690e+02,
        -3.066479806614716e+01,
         2.506628277459239e+00

      ];


      const b = [

        -5.447609879822406e+01,
         1.615858368580409e+02,
        -1.556989798598866e+02,
         6.680131188771972e+01,
        -1.328068155288572e+01

      ];


      const c = [

        -7.784894002430293e-03,
        -3.223964580411365e-01,
        -2.400758277161838e+00,
        -2.549732539343734e+00,
         4.374664141464968e+00,
         2.938163982698783e+00

      ];


      const d = [

         7.784695709041462e-03,
         3.224671290700398e-01,
         2.445134137142996e+00,
         3.754408661907416e+00

      ];


      const plow =
        0.02425;


      const phigh =
        1 - plow;


      let q;

      let r;


      if (
        p < plow
      ) {

        q =
          Math.sqrt(
            -2 *
            Math.log(p)
          );


        return (

          (
            (
              (
                (
                  (
                    c[0] * q
                    + c[1]
                  ) * q
                  + c[2]
                ) * q
                + c[3]
              ) * q
              + c[4]
            ) * q
            + c[5]
          )

          /

          (
            (
              (
                (
                  d[0] * q
                  + d[1]
                ) * q
                + d[2]
              ) * q
              + d[3]
            ) * q
            + 1
          )

        );

      }


      if (
        p > phigh
      ) {

        q =
          Math.sqrt(
            -2 *
            Math.log(
              1-p
            )
          );


        return -(

          (
            (
              (
                (
                  (
                    c[0] * q
                    + c[1]
                  ) * q
                  + c[2]
                ) * q
                + c[3]
              ) * q
              + c[4]
            ) * q
            + c[5]
          )

          /

          (
            (
              (
                (
                  d[0] * q
                  + d[1]
                ) * q
                + d[2]
              ) * q
              + d[3]
            ) * q
            + 1
          )

        );

      }


      q =
        p - 0.5;


      r =
        q * q;


      return (

        (
          (
            (
              (
                (
                  a[0] * r
                  + a[1]
                ) * r
                + a[2]
              ) * r
              + a[3]
            ) * r
            + a[4]
          ) * r
          + a[5]
        ) * q

        /

        (
          (
            (
              (
                (
                  b[0] * r
                  + b[1]
                ) * r
                + b[2]
              ) * r
              + b[3]
            ) * r
            + b[4]
          ) * r
          + 1
        )

      );

    }


    /* =====================================================
       5. 集計関数
    ===================================================== */

    function calculateSummary(data) {


      const go_data =
        data.filter(
          d =>
            d.stimulus_type === "go"
        );


      const nogo_data =
        data.filter(
          d =>
            d.stimulus_type === "nogo"
        );


      /* ---------------------------------------------------
         Go反応時間

         150～1000 msを
         有効Go RTとして集計
      --------------------------------------------------- */

      const all_go_responses =

        go_data.filter(
          d =>
            d.rt !== null
        );


      const valid_go_rt =

        all_go_responses

          .filter(
            d =>
              d.rt >= 150
              &&
              d.rt <= 1000
          )

          .map(
            d =>
              d.rt
          );


      const excluded_rt_count =

        all_go_responses.length
        -
        valid_go_rt.length;


      const n_valid_rt =
        valid_go_rt.length;


      /* ---------------------------------------------------
         RT統計量
      --------------------------------------------------- */

      let mean_rt = NaN;

      let median_rt = NaN;

      let min_rt = NaN;

      let max_rt = NaN;

      let sd_rt = NaN;

      let se_rt = NaN;

      let cv_rt = NaN;


      if (
        n_valid_rt > 0
      ) {


        mean_rt =

          valid_go_rt.reduce(
            (a,b) =>
              a+b,
            0
          )

          /

          n_valid_rt;


        const sorted_rt =

          [...valid_go_rt]
            .sort(
              (a,b) =>
                a-b
            );


        if (
          sorted_rt.length % 2 === 0
        ) {


          median_rt =

            (

              sorted_rt[
                sorted_rt.length/2 - 1
              ]

              +

              sorted_rt[
                sorted_rt.length/2
              ]

            )

            /

            2;

        }

        else {


          median_rt =

            sorted_rt[
              Math.floor(
                sorted_rt.length/2
              )
            ];

        }


        min_rt =
          Math.min(
            ...valid_go_rt
          );


        max_rt =
          Math.max(
            ...valid_go_rt
          );


        if (
          n_valid_rt > 1
        ) {


          sd_rt =

            Math.sqrt(

              valid_go_rt.reduce(

                (sum,x) =>

                  sum

                  +

                  Math.pow(
                    x - mean_rt,
                    2
                  ),

                0

              )

              /

              (
                n_valid_rt - 1
              )

            );


          se_rt =

            sd_rt

            /

            Math.sqrt(
              n_valid_rt
            );


          cv_rt =

            sd_rt

            /

            mean_rt;

        }

      }


      /* ---------------------------------------------------
         正答・エラー
      --------------------------------------------------- */

      const go_correct_count =

        go_data.filter(
          d =>
            d.correct === true
        ).length;


      const nogo_correct_count =

        nogo_data.filter(
          d =>
            d.correct === true
        ).length;


      const omission_count =

        go_data.filter(
          d =>
            d.error_type === "omission"
        ).length;


      const commission_count =

        nogo_data.filter(
          d =>
            d.error_type === "commission"
        ).length;


      /* ---------------------------------------------------
         Accuracy
      --------------------------------------------------- */

      const go_accuracy =

        go_data.length > 0

        ?

        100 *
        go_correct_count /
        go_data.length

        :

        NaN;


      const nogo_accuracy =

        nogo_data.length > 0

        ?

        100 *
        nogo_correct_count /
        nogo_data.length

        :

        NaN;


      const omission_rate =

        go_data.length > 0

        ?

        100 *
        omission_count /
        go_data.length

        :

        NaN;


      const commission_rate =

        nogo_data.length > 0

        ?

        100 *
        commission_count /
        nogo_data.length

        :

        NaN;


      const total_trials =
        data.length;


      const total_correct =

        data.filter(
          d =>
            d.correct === true
        ).length;


      const overall_accuracy =

        total_trials > 0

        ?

        100 *
        total_correct /
        total_trials

        :

        NaN;


      /* ---------------------------------------------------
         Signal Detection Theory
      --------------------------------------------------- */

      /*
        Hit:
        Go刺激への正しい反応

        False Alarm:
        No-Go刺激への誤反応
      */


      const raw_hit_rate =

        go_data.length > 0

        ?

        go_correct_count /
        go_data.length

        :

        NaN;


      const raw_fa_rate =

        nogo_data.length > 0

        ?

        commission_count /
        nogo_data.length

        :

        NaN;


      let corrected_hit_rate =
        raw_hit_rate;


      let corrected_fa_rate =
        raw_fa_rate;


      /*
        Half-trial correction
      */

      if (
        go_data.length > 0
      ) {


        if (
          corrected_hit_rate === 1
        ) {

          corrected_hit_rate =

            1

            -

            (
              0.5 /
              go_data.length
            );

        }


        else if (
          corrected_hit_rate === 0
        ) {

          corrected_hit_rate =

            0.5 /
            go_data.length;

        }

      }


      if (
        nogo_data.length > 0
      ) {


        if (
          corrected_fa_rate === 1
        ) {

          corrected_fa_rate =

            1

            -

            (
              0.5 /
              nogo_data.length
            );

        }


        else if (
          corrected_fa_rate === 0
        ) {

          corrected_fa_rate =

            0.5 /
            nogo_data.length;

        }

      }


      let dprime =
        NaN;


      let beta =
        NaN;


      if (

        Number.isFinite(
          corrected_hit_rate
        )

        &&

        Number.isFinite(
          corrected_fa_rate
        )

      ) {


        const zHit =

          normInv(
            corrected_hit_rate
          );


        const zFA =

          normInv(
            corrected_fa_rate
          );


        dprime =

          zHit
          -
          zFA;


        beta =

          Math.exp(

            (

              Math.pow(
                zFA,
                2
              )

              -

              Math.pow(
                zHit,
                2
              )

            )

            /

            2

          );

      }


      return {


        total_trials:
          total_trials,


        go_trials:
          go_data.length,


        nogo_trials:
          nogo_data.length,


        valid_rt_count:
          n_valid_rt,


        excluded_rt_count:
          excluded_rt_count,


        mean_rt:
          mean_rt,


        median_rt:
          median_rt,


        min_rt:
          min_rt,


        max_rt:
          max_rt,


        sd_rt:
          sd_rt,


        se_rt:
          se_rt,


        cv_rt:
          cv_rt,


        go_correct_count:
          go_correct_count,


        nogo_correct_count:
          nogo_correct_count,


        omission_count:
          omission_count,


        commission_count:
          commission_count,


        go_accuracy:
          go_accuracy,


        nogo_accuracy:
          nogo_accuracy,


        omission_rate:
          omission_rate,


        commission_rate:
          commission_rate,


        overall_accuracy:
          overall_accuracy,


        raw_hit_rate:
          raw_hit_rate,


        raw_fa_rate:
          raw_fa_rate,


        corrected_hit_rate:
          corrected_hit_rate,


        corrected_fa_rate:
          corrected_fa_rate,


        dprime:
          dprime,


        beta:
          beta

      };

    }


    /* =====================================================
       6. Block別・本試行全体
    ===================================================== */

    const summary_block1 =
      calculateSummary(
        block1_data
      );


    const summary_block2 =
      calculateSummary(
        block2_data
      );


    const summary_total =
      calculateSummary(
        main_data
      );


    /* =====================================================
       7. CSV Escape
    ===================================================== */

    function csvEscape(value) {


      if (
        value === null
        ||
        value === undefined
      ) {

        return "";

      }


      const str =
        String(value);


      if (

        str.includes(",")

        ||

        str.includes('"')

        ||

        str.includes("\n")

      ) {

        return (

          '"'

          +

          str.replace(
            /"/g,
            '""'
          )

          +

          '"'

        );

      }


      return str;

    }


    /* =====================================================
       8. CSV作成
    ===================================================== */

    let csv = "";


    /* -----------------------------------------------------
       基本情報
    ----------------------------------------------------- */

    csv +=
      "===== 基本情報 =====\n";


    csv +=
      "被験者ID,"
      +
      csvEscape(
        participant_id
      )
      +
      "\n";


    csv +=
      "測定時期コード,"
      +
      csvEscape(
        measurement_code
      )
      +
      "\n";


    csv +=
      "測定時期,"
      +
      csvEscape(
        measurement_label
      )
      +
      "\n";


    csv +=
      "実施日時,"
      +
      csvEscape(
        experiment_date
      )
      +
      "\n";


    csv +=
      "課題,Go/No-Go\n";


    csv +=
      "練習試行数,10\n";


    csv +=
      "本試行1試行数,100\n";


    csv +=
      "本試行2試行数,100\n";


    csv +=
      "各Block Go試行数,70\n";


    csv +=
      "各Block No-Go試行数,30\n";


    csv +=
      "Block間休憩,60秒\n";


    /* -----------------------------------------------------
       Trial-level data

       練習を含めて保存
    ----------------------------------------------------- */

    csv +=
      "\n===== Trial level data =====\n";


    csv +=

      "被験者ID,測定時期コード,測定時期,モード,ブロック,試行番号,刺激種類,刺激色,反応時間(ms),正誤,エラー種類\n";


    let practice_number =
      0;


    let block1_number =
      0;


    let block2_number =
      0;


    all_data.forEach(
      function(d) {


        let trial_number = "";


        if (
          d.mode === "practice"
        ) {

          practice_number++;

          trial_number =
            practice_number;

        }


        else if (
          d.block === 1
        ) {

          block1_number++;

          trial_number =
            block1_number;

        }


        else if (
          d.block === 2
        ) {

          block2_number++;

          trial_number =
            block2_number;

        }


        csv += [

          participant_id,

          measurement_code,

          measurement_label,

          d.mode,

          d.block ?? "",

          trial_number,

          d.stimulus_type,

          d.color,

          d.rt ?? "",

          d.correct,

          d.error_type

        ]

        .map(
          csvEscape
        )

        .join(",")

        +

        "\n";

      }

    );


    /* =====================================================
       9. 集計出力
    ===================================================== */

    function appendSummary(
      label,
      summary
    ) {


      function f1(x) {

        return Number.isFinite(x)

          ?

          x.toFixed(1)

          :

          "";

      }


      function f2(x) {

        return Number.isFinite(x)

          ?

          x.toFixed(2)

          :

          "";

      }


      function f3(x) {

        return Number.isFinite(x)

          ?

          x.toFixed(3)

          :

          "";

      }


      function f4(x) {

        return Number.isFinite(x)

          ?

          x.toFixed(4)

          :

          "";

      }


      csv +=
        "\n===== "
        +
        label
        +
        " =====\n";


      csv +=
        "総試行数,"
        +
        summary.total_trials
        +
        "\n";


      csv +=
        "Go試行数,"
        +
        summary.go_trials
        +
        "\n";


      csv +=
        "No-Go試行数,"
        +
        summary.nogo_trials
        +
        "\n";


      csv +=
        "有効Go RT数,"
        +
        summary.valid_rt_count
        +
        "\n";


      csv +=
        "除外RT数,"
        +
        summary.excluded_rt_count
        +
        "\n";


      csv +=
        "平均RT(ms),"
        +
        f1(
          summary.mean_rt
        )
        +
        "\n";


      csv +=
        "中央値RT(ms),"
        +
        f1(
          summary.median_rt
        )
        +
        "\n";


      csv +=
        "最小RT(ms),"
        +
        f1(
          summary.min_rt
        )
        +
        "\n";


      csv +=
        "最大RT(ms),"
        +
        f1(
          summary.max_rt
        )
        +
        "\n";


      csv +=
        "RT標準偏差(ms),"
        +
        f1(
          summary.sd_rt
        )
        +
        "\n";


      csv +=
        "RT標準誤差(ms),"
        +
        f1(
          summary.se_rt
        )
        +
        "\n";


      csv +=
        "RT CV,"
        +
        f3(
          summary.cv_rt
        )
        +
        "\n";


      csv +=
        "Go正答数,"
        +
        summary.go_correct_count
        +
        "\n";


      csv +=
        "No-Go正答数,"
        +
        summary.nogo_correct_count
        +
        "\n";


      csv +=
        "Go正答率(%),"
        +
        f1(
          summary.go_accuracy
        )
        +
        "\n";


      csv +=
        "No-Go正答率(%),"
        +
        f1(
          summary.nogo_accuracy
        )
        +
        "\n";


      csv +=
        "Commission Error数,"
        +
        summary.commission_count
        +
        "\n";


      csv +=
        "Commission Error率(%),"
        +
        f1(
          summary.commission_rate
        )
        +
        "\n";


      csv +=
        "Omission Error数,"
        +
        summary.omission_count
        +
        "\n";


      csv +=
        "Omission Error率(%),"
        +
        f1(
          summary.omission_rate
        )
        +
        "\n";


      csv +=
        "Overall Accuracy(%),"
        +
        f1(
          summary.overall_accuracy
        )
        +
        "\n";


      /*
        補正前の率
      */

      csv +=
        "Hit Rate(raw),"
        +
        f4(
          summary.raw_hit_rate
        )
        +
        "\n";


      csv +=
        "False Alarm Rate(raw),"
        +
        f4(
          summary.raw_fa_rate
        )
        +
        "\n";


      /*
        d′計算用補正後
      */

      csv +=
        "Hit Rate(corrected),"
        +
        f4(
          summary.corrected_hit_rate
        )
        +
        "\n";


      csv +=
        "False Alarm Rate(corrected),"
        +
        f4(
          summary.corrected_fa_rate
        )
        +
        "\n";


      csv +=
        "d-prime,"
        +
        f3(
          summary.dprime
        )
        +
        "\n";


      csv +=
        "Beta,"
        +
        f3(
          summary.beta
        )
        +
        "\n";

    }


    appendSummary(

      "Block 1 集計結果",

      summary_block1

    );


    appendSummary(

      "Block 2 集計結果",

      summary_block2

    );


    appendSummary(

      "本試行全体 集計結果",

      summary_total

    );


    /* =====================================================
       10. CSV保存
    ===================================================== */

    const bom =

      new Uint8Array(

        [
          0xEF,
          0xBB,
          0xBF
        ]

      );


    const blob =

      new Blob(

        [
          bom,
          csv
        ],

        {
          type:
            "text/csv;charset=utf-8;"
        }

      );


    const url =

      URL.createObjectURL(
        blob
      );


    const link =

      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =

      participant_id

      +

      "_"

      +

      measurement_code

      +

      "_GoNoGo結果.csv";


    document.body
      .appendChild(
        link
      );


    link.click();


    document.body
      .removeChild(
        link
      );


    URL.revokeObjectURL(
      url
    );

  }

});


/* =========================================================
   11. 被験者ID入力
========================================================= */

const participant_form = {

  type:
    jsPsychSurveyText,


  questions: [

    {

      prompt:
        "被験者IDを入力してください",

      placeholder:
        "例：01 または 001",

      name:
        "participant_id",

      required:
        true

    }

  ],


  button_label:
    "次へ",


  on_finish:
  function(data) {


    participant_id =

      String(
        data.response.participant_id
      )
      .trim();


    /*
      2桁または3桁の
      半角数字のみ許可
    */

    if (
      !/^\d{2,3}$/.test(
        participant_id
      )
    ) {


      alert(

        "被験者IDは半角数字2桁または3桁で入力してください。\n例：01、12、001、123"

      );


      /*

/* =========================================================
   14. Fixation
========================================================= */

function makeFixation() {


  return {


    type:
      jsPsychHtmlKeyboardResponse,


    stimulus:

      '<div style="font-size:60px;">+</div>',


    choices:
      "NO_KEYS",


    trial_duration:
      250

}


/* =========================================================
   15. Go/No-Go Trial
========================================================= */

function makeTrial(

  stimulus_type,

  color,

  mode,

  block_number

) {


  return {


    type:
      jsPsychHtmlKeyboardResponse,


    stimulus: `

      <div

        style="

          width:160px;

          height:160px;

          border-radius:50%;

          background-color:${color};

          margin:100px auto;

        "

      >
      </div>

    `,


    choices:
      [" "],


    /*
      刺激提示500 ms
    */

    trial_duration:
      500,


    /*
      キーを押しても
      500 msが終わるまでTrialは継続
    */

    response_ends_trial:
      false,


    data: {


      task:
        "go_nogo",


      mode:
        mode,


      stimulus_type:
        stimulus_type,


      color:
        color,


      stimulus_duration:
        500,


      block:
        block_number

    },


    on_finish:
    function(data) {


      /* ---------------------------------------------------
         Go
      --------------------------------------------------- */

      if (
        stimulus_type === "go"
      ) {


        data.correct =

          data.response !== null;

      }


      /* ---------------------------------------------------
         No-Go
      --------------------------------------------------- */

      else {


        data.correct =

          data.response === null;

      }


      /* ---------------------------------------------------
         エラー分類
      --------------------------------------------------- */

      if (

        stimulus_type === "go"

        &&

        data.response === null

      ) {


        data.error_type =
          "omission";

      }


      else if (

        stimulus_type === "nogo"

        &&

        data.response !== null

      ) {


        data.error_type =
          "commission";

      }


      else {


        data.error_type =
          "none";

      }

    }

  };

}


/* =========================================================
   16. Trial list
========================================================= */

function createTrialList(

  go_count,

  nogo_count

) {


  let trials =
    [];


  for (
    let i = 0;
    i < go_count;
    i++
  ) {


    trials.push(
      [
        "go",
        "blue"
      ]
    );

  }


  for (
    let i = 0;
    i < nogo_count;
    i++
  ) {


    trials.push(
      [
        "nogo",
        "red"
      ]
    );

  }


  return jsPsych
    .randomization
    .shuffle(
      trials
    );

}
