<script>


/* =========================================================
   1. 基本設定
========================================================= */

const MAIN_DURATION_MS = 90000;

const FORMS_PER_SESSION = 3;

const MASTER_SEED = 20260825;


const SYMBOLS = [
  "◆",
  "■",
  "▲",
  "●",
  "★",
  "♥",
  "♣",
  "♠",
  "☀"
];


const DIGITS = [
  "1","2","3","4","5",
  "6","7","8","9"
];

========================================================= */

/* =========================================================
   3. 変数
========================================================= */

let language = "ja";

/* =========================================================
   4. 言語関数
========================================================= */

function t(ja, en) {

  return language === "en"
    ? en
    : ja;
}


function timepointName(tp) {

  return language === "en"
    ? tp.en
    : tp.ja;
}


/* =========================================================
   5. Seed付き乱数
========================================================= */

function mulberry32(seed) {

  return function() {

    let t =
      seed += 0x6D2B79F5;

    t =
      Math.imul(
        t ^ (t >>> 15),
        t | 1
      );

    t ^=
      t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (
        t ^ (t >>> 14)
      ) >>> 0
    ) / 4294967296;
  };
}


function seededShuffle(
  array,
  rng
) {

  const a =
    [...array];

  for (
    let i = a.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        rng() *
        (i + 1)
      );

    [
      a[i],
      a[j]
    ] =
    [
      a[j],
      a[i]
    ];
  }

  return a;
}


/* =========================================================
   6. 被験者ID hash
========================================================= */

function hashString(text) {

  let hash =
    2166136261;

  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    hash ^=
      text.charCodeAt(i);

    hash =
      Math.imul(
        hash,
        16777619
      );
  }

  return hash >>> 0;
}


/* =========================================================
   7. 18種類の対応表
========================================================= */

function hammingDistance(
  a,
  b
) {

  let distance = 0;

  for (
    let i = 0;
    i < a.length;
    i++
  ) {

    if (
      a[i] !== b[i]
    ) {

      distance++;
    }
  }

  return distance;
}


function createForms() {

  const rng =
    mulberry32(
      MASTER_SEED
    );

  const permutations = [];

  let attempts = 0;


  while (
    permutations.length < N_FORMS
    &&
    attempts < 100000
  ) {

    attempts++;


    const candidate =
      seededShuffle(
        DIGITS,
        rng
      );


    const acceptable =
      permutations.every(
        existing =>
          hammingDistance(
            existing,
            candidate
          ) >= 6
      );


    if (
      acceptable
    ) {

      permutations.push(
        candidate
      );
    }
  }


  if (
    permutations.length < N_FORMS
  ) {

    throw new Error(
      "Unable to generate 18 SDMT forms."
    );
  }


  return permutations.map(
    (digits,index) => {

      const map = {};


      SYMBOLS.forEach(
        (symbol,i) => {

          map[symbol] =
            digits[i];

        }
      );


      return {

        formNumber:
          index + 1,

        map:
          map

      };

    }
  );
}


const FORMS =
  createForms();


/* =========================================================
   8. 練習用対応表
========================================================= */

const PRACTICE_MAP = {

  "◆": "1",
  "■": "2",
  "▲": "3",
  "●": "4",
  "★": "5",
  "♥": "6",
  "♣": "7",
  "♠": "8",
  "☀": "9"

};


/* =========================================================
   9. 刺激系列
========================================================= */

function createBalancedSequence(
  seed,
  length
) {

  const rng =
    mulberry32(seed);

  const sequence = [];


  while (
    sequence.length < length
  ) {

    const cycle =
      seededShuffle(
        SYMBOLS,
        rng
      );

    sequence.push(
      ...cycle
    );
  }


  return sequence.slice(
    0,
    length
  );
}


const MAIN_SEQUENCE =
  createBalancedSequence(
    MASTER_SEED + 9999,
    500
  );


const PRACTICE_SEQUENCE =
  createBalancedSequence(
    MASTER_SEED + 5555,
    PRACTICE_TRIALS
  );


/* =========================================================
   10. 被験者ごとのフォーム割付
========================================================= */

function createParticipantSetOrder(
  participant
) {

  const offset =
    hashString(
      participant
    ) % 6;


  const order = [];


  for (
    let i = 0;
    i < 6;
    i++
  ) {

    order.push(
      (
        offset + i
      ) % 6
      + 1
    );
  }


  return order;
}


function getFormIndex(
  blockNumber
) {

  return (
    selectedSetNumber - 1
  ) * 3
  +
  (
    blockNumber - 1
  );
}


/* =========================================================
   11. 対応表表示
========================================================= */

function keyTableHTML(map) {

          "
        >

      `;
    }

  html +=
    "</tr><tr>";


  numberOrder.forEach(
    number => {

      html += `

        <td
          style="
            border:1px solid #999;
            padding:10px 16px;
          "
        >
          ${number}
        </td>
      `;
    }
  );


  html +=
    "</tr></table>";


  return html;
}


/* =========================================================
   12. 統計
========================================================= */

function mean(values) {

  if (
    values.length === 0
  ) {

    return NaN;
  }


  return values.reduce(
    (a,b) => a+b,
    0
  ) / values.length;
}


function median(values) {

  if (
    values.length === 0
  ) {

    return NaN;
  }


  const sorted =
    [...values].sort(
      (a,b) => a-b
    );


  const middle =
    Math.floor(
      sorted.length / 2
    );


  if (
    sorted.length % 2 === 0
  ) {

    return (
      sorted[middle-1]
      +
      sorted[middle]
    ) / 2;
  }


  return sorted[middle];
}


function sd(values) {

  if (
    values.length < 2
  ) {

    return NaN;
  }


  const m =
    mean(values);


  return Math.sqrt(

    values.reduce(
      (sum,x) =>
        sum +
        Math.pow(
          x-m,
          2
        ),
      0
    )

    /

    (
      values.length - 1
    )

  );
}


/* =========================================================
   13. 結果計算
========================================================= */

function calculateFromData(data) {


  const responded =
    data.filter(
      d =>
        d.response !== null
    );


  const totalResponses =
    responded.length;


  const correctCount =
    responded.filter(
      d =>
        d.correct === true
    ).length;


  const incorrectCount =
    responded.filter(
      d =>
        d.correct === false
    ).length;


  const accuracy =
    totalResponses > 0
    ?
      100 *
      correctCount /
      totalResponses
    :
      NaN;


  const errorRate =
    totalResponses > 0
    ?
      100 *
      incorrectCount /
      totalResponses
    :
      NaN;


  const allRT =
    responded.filter(
      d =>
        d.rt !== null
    );


  const validRTData =
    allRT.filter(
      d =>
        d.rt >= 150
        &&
        d.rt <= 5000
    );


  const excludedRTCount =
    allRT.length -
    validRTData.length;


  const validRT =
    validRTData.map(
      d => d.rt
    );


  const correctRT =
    validRTData
      .filter(
        d =>
          d.correct === true
      )
      .map(
        d => d.rt
      );


  const meanRT =
    mean(
      validRT
    );


  const medianRT =
    median(
      validRT
    );


  const minRT =
    validRT.length
    ?
      Math.min(
        ...validRT
      )
    :
      NaN;


  const maxRT =
    validRT.length
    ?
      Math.max(
        ...validRT
      )
    :
      NaN;


  const sdRT =
    sd(
      validRT
    );


  const seRT =
    validRT.length > 0
    ?
      sdRT /
      Math.sqrt(
        validRT.length
      )
    :
      NaN;


  const cvRT =
    Number.isFinite(
      meanRT
    )
    &&
    meanRT !== 0
    ?
      sdRT /
      meanRT
    :
      NaN;


  const meanCorrectRT =
    mean(
      correctRT
    );


  const sdCorrectRT =
    sd(
      correctRT
    );


  const rawScore =
    correctCount;


  const correctPerSecond =
    correctCount / 90;


  const correctPerMinute =
    correctCount / 1.5;


  return {

    total_responses:
      totalResponses,

    correct_count:
      correctCount,

    incorrect_count:
      incorrectCount,

    raw_score:
      rawScore,

    accuracy:
      accuracy,

    error_rate:
      errorRate,

    valid_rt_count:
      validRT.length,

    excluded_rt_count:
      excludedRTCount,

    mean_rt:
      meanRT,

    median_rt:
      medianRT,

    min_rt:
      minRT,

    max_rt:
      maxRT,

    sd_rt:
      sdRT,

    se_rt:
      seRT,

    cv_rt:
      cvRT,

    mean_correct_rt:
      meanCorrectRT,

    sd_correct_rt:
      sdCorrectRT,

    correct_per_second:
      correctPerSecond,

    correct_per_minute:
      correctPerMinute

  };
}


function calculateBlockResults(
  blockNumber
) {

  const data =
    jsPsych.data
      .get()
      .filter({
        task:
          "sdmt_main",
        block:
          blockNumber
      })
      .values();


  return calculateFromData(
    data
  );
}


function calculateOverallResults() {

  const data =
    jsPsych.data
      .get()
      .filter({
        task:
          "sdmt_main"
      })
      .values();


  return calculateFromData(
    data
  );
}


/* =========================================================
   14. 数値表示
========================================================= */

function formatNumber(
  x,
  digits = 1
) {

  if (
    x === undefined
    ||
    x === null
    ||
    !Number.isFinite(x)
  ) {

    return "";
  }


  return Number(x)
    .toFixed(
      digits
    );
}


/* =========================================================
   15. jsPsych初期化
========================================================= */

const jsPsych =
  initJsPsych({

    on_finish:

      const r1 =
        calculateBlockResults(1);

      const r2 =
        calculateBlockResults(2);

      const r3 =
        calculateBlockResults(3);

      const overall =
        calculateOverallResults();


      const average = {

        total_responses:
          (
            r1.total_responses
            +
            r2.total_responses
            +
            r3.total_responses
          ) / 3,

        correct_count:
          (
            r1.correct_count
            +
            r2.correct_count
            +
            r3.correct_count
          ) / 3,

          (
            r1.incorrect_count

            +

            +

        mean_rt:
          (

            +
            r2.mean_rt
            +
            r3.mean_rt
          ) / 3,

        median_rt:
          (
            r1.median_rt
            +
            r2.median_rt
            +
            r3.median_rt
          ) / 3,

        sd_rt:
          (
            r1.sd_rt
            +
            r2.sd_rt
            +
            r3.sd_rt
          ) / 3,

        cv_rt:
          (
            r1.cv_rt
            +
            r2.cv_rt
            +
            r3.cv_rt
          ) / 3,

        mean_correct_rt:
          (
            r1.mean_correct_rt
            +
            r2.mean_correct_rt
            +
            r3.mean_correct_rt
          ) / 3

      };


      /* ===================================================
         CSV
      =================================================== */

      let csv = "";


      csv +=
        "===== 基本情報 / Basic Information =====\n";


      csv +=
        "被験者ID / Participant ID,"
        +
        participant_id
        +
        "\n";


      csv +=
        "言語 / Language,"
        +
        (
          language === "en"
          ?
          "English"
          :
          "Japanese"
        )
        +
        "\n";


      csv +=
        "測定時点コード / Time Point Code,"
        +
        selectedTimepoint.code
        +
        "\n";


      csv +=
        "測定時点 / Measurement Time Point,"
        +
        timepointName(
          selectedTimepoint
        )
        +
        "\n";


      csv +=
        "使用セット / Set,"
        +
        selectedSetNumber
        +
        "\n";


      csv +=
        "被験者セット順 / Set Order,"
        +
        participantSetOrder.join("-")
        +
        "\n";


      csv +=
        "実施日時 / Date and Time,"
        +
        start_time
        +
        "\n";


      csv +=
        "本試行時間 / Main Trial Duration,90 seconds × 3\n";


      csv +=
        "ブロック間休憩 / Break,60 seconds\n";


      /* ===================================================
         Trial-level data
      =================================================== */

      csv +=
        "\n===== Trial level data =====\n";


      csv +=
        "Participant_ID,Timepoint,Block,Form,Trial_Number,Symbol,Correct_Response,Response,Correct,RT_ms\n";


      const allData =
        jsPsych.data
          .get()
          .filter({
            task:
              "sdmt_main"
          })
          .values();


      allData.forEach(
        d => {

          csv += [

            participant_id,

            selectedTimepoint.code,

            d.block,

            "F"
            +
            String(
              d.form_number
            ).padStart(
              2,
              "0"
            ),

            d.trial_number,

            d.symbol,

            d.correct_response,

            d.response ?? "",

            d.correct ?? "",

            d.rt ?? ""

          ].join(",")
          +
          "\n";

        }
      );


      /* ===================================================
         Summary
      =================================================== */

      csv +=
        "\n===== 各回・合計・平均 / Summary =====\n";


      csv +=
        "Section,Form,Total_Responses,Correct,Incorrect,SDMT_Raw_Score,Accuracy_Percent,Error_Rate_Percent,Valid_RT_Count,Excluded_RT_Count,Mean_RT_ms,Median_RT_ms,Min_RT_ms,Max_RT_ms,RT_SD_ms,RT_SE_ms,RT_CV,Mean_Correct_RT_ms,Correct_RT_SD_ms,Correct_Per_Second,Correct_Per_Minute\n";


      function addRow(
        name,
        form,
        r
      ) {

        csv += [

          name,

          form,

          formatNumber(
            r.total_responses,
            1
          ),

          formatNumber(
            r.correct_count,
            1
          ),

          formatNumber(
            r.incorrect_count,
            1
          ),

          formatNumber(
            r.raw_score,
            1
          ),

          formatNumber(
            r.accuracy,
            1
          ),

          formatNumber(
            r.error_rate,
            1
          ),

          r.valid_rt_count,

          r.excluded_rt_count,

          formatNumber(
            r.mean_rt,
            1
          ),

          formatNumber(
            r.median_rt,
            1
          ),

          formatNumber(
            r.min_rt,
            1
          ),

          formatNumber(
            r.max_rt,
            1
          ),

          formatNumber(
            r.sd_rt,
            1
          ),

          formatNumber(
            r.se_rt,
            1
          ),

          formatNumber(
            r.cv_rt,
            3
          ),

          formatNumber(
            r.mean_correct_rt,
            1
          ),

          formatNumber(
            r.sd_correct_rt,
            1
          ),

          formatNumber(
            r.correct_per_second,
            3
          ),

          formatNumber(
            r.correct_per_minute,
            2
          )

        ].join(",")
        +
        "\n";
      }


      const form1 =
        FORMS[
          getFormIndex(1)
        ].formNumber;


      const form2 =
        FORMS[
          getFormIndex(2)
        ].formNumber;


      const form3 =
        FORMS[
          getFormIndex(3)
        ].formNumber;


      addRow(
        "Main Trial 1",
        "F"
        +
        String(
          form1
        ).padStart(
          2,
          "0"
        ),
        r1
      );


      addRow(
        "Main Trial 2",
        "F"
        +
        String(
          form2
        ).padStart(
          2,
          "0"
        ),
        r2
      );


      addRow(
        "Main Trial 3",
        "F"
        +
        String(
          form3
        ).padStart(
          2,
          "0"
        ),
        r3
      );


      addRow(
        "3-Trial Total",
        "",
        overall
      );


      csv += [

        "3-Trial Mean",

        "",

        formatNumber(
          average.total_responses,
          1
        ),

        formatNumber(
          average.correct_count,
          1
        ),

        formatNumber(
          average.incorrect_count,
          1
        ),

        formatNumber(
          average.correct_count,
          1
        ),

        formatNumber(
          average.accuracy,
          1
        ),

        formatNumber(
          average.error_rate,
          1
        ),

        "",

        "",

        formatNumber(
          average.mean_rt,
          1
        ),

        formatNumber(
          average.median_rt,
          1
        ),

        "",

        "",

        formatNumber(
          average.sd_rt,
          1
        ),

        "",

        formatNumber(
          average.cv_rt,
          3
        ),

        formatNumber(
          average.mean_correct_rt,
          1
        ),

        "",

        "",

        ""

      ].join(",")
      +
      "\n";


      /* ===================================================
         CSV保存
      =================================================== */

      const bom =
        new Uint8Array(
          [
            0xEF,
            0xBB,
            0xBF
          ]
        );


      const blob =
        new Blob(
          [
            bom,
            csv
          ],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =

        participant_id
        +
        "_"
        +
        selectedTimepoint.code
        +
        "_SDMT_3results.csv";


      document.body
        .appendChild(
          link
        );


      link.click();


      document.body
        .removeChild(
          link
        );


      URL.revokeObjectURL(
        url
      );

    }

  });


/* =========================================================
   16. Timeline
========================================================= */

const timeline = [];


/* =========================================================
   17. 言語・ID・測定時点
========================================================= */

timeline.push({

  type:
    jsPsychSurveyHtmlForm,


  html: `

    <div class="text">

      <h1>
        SDMT
      </h1>


      <p>
        <strong>

      jsPsychHtmlKeyboardResponse,

    function() {

            "Press the corresponding number key."

        </p>

    choices:
      DIGITS,


    data: {

      task:
        "sdmt_practice",

      block:
        "practice",

        trialNumber,

      symbol:
        symbol,

        PRACTICE_MAP[
          symbol
        ]

    },


    on_finish:
    function(data) {

      data.correct =
        data.response ===

/* =========================================================
   23. Main Trial
========================================================= */

function createSDMTMainTrial() {

  return {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus:
    function() {


      const symbol =

        MAIN_SEQUENCE[
          currentSequenceIndex %
          MAIN_SEQUENCE.length
        ];


      currentSequenceIndex++;


      window.currentSDMTSymbol =
        symbol;


      return `

        ${keyTableHTML(
          currentMap
        )}


        <div class="symbol">
          ${symbol}
        </div>


        <p style="font-size:20px;">

          ${t(
            "対応する数字キーを押してください。",
            "Press the corresponding number key."
          )}

        </p>

      `;

    },


    choices:
      DIGITS,


    trial_duration:
    function() {


      const remaining =

        MAIN_DURATION_MS

        -

        (
          performance.now()
          -
          taskStartTime
        );


      return Math.max(
        1,
        remaining
      );

    },


    response_ends_trial:
      true,


    data:
    function() {


      blockTrialNumber++;


      const symbol =
        window.currentSDMTSymbol;


      return {

        task:
          "sdmt_main",

        block:
          currentBlock,

        form_number:
          currentFormNumber,

        trial_number:
          blockTrialNumber,

        symbol:
          symbol,

        correct_response:
          currentMap[
            symbol
          ]

      };

    },


    on_finish:
    function(data) {


      if (
        data.response === null
      ) {

        data.correct =
          null;

        data.cutoff_trial =
          true;

        return;
      }


      data.correct =
        data.response ===
        data.correct_response;


      data.cutoff_trial =
        false;

    }

  };
}

            )}

          </h2>

              `Next: Main Trial ${blockNumber + 1}.`
            )}

          <p>

            ${t(
              "1分間休憩してください。",
              "Please take a 1-minute break."
            )}

          </p>


          <div
            id="countdown"
            class="countdown"
          >
            60
          </div>


          <p>
            ${t(
              "秒",
              "seconds"
            )}
          </p>


          <p>

            ${t(
              "60秒後に自動的に次の本試行へ進みます。",
              "The next main trial will begin automatically after 60 seconds."
            )}

          </p>

        </div>

      `;

    },


    choices:
      "NO_KEYS",


    trial_duration:
      BREAK_DURATION_MS,


    on_load:
    function() {


      let remaining =
        60;


      const timer =

        setInterval(
          function() {


            remaining--;


            const el =
              document
                .getElementById(
                  "countdown"
                );


            if (
              el
            ) {

              el.textContent =
                Math.max(
                  remaining,
                  0
                );

            }


            if (
              remaining <= 0
            ) {

              clearInterval(
                timer
              );

            }

          },

          1000
        );

    }

  };
}

      )
