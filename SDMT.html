/* =========================================================

========================================================= */

/*

  18フォームは同じものが再現される
*/

/*
  9種類の記号
*/

/* =========================================================
   4. 乱数
========================================================= */

function mulberry32(seed) {

  return function() {

    let t =
      seed += 0x6D2B79F5;

    t =
      Math.imul(
        t ^ (t >>> 15),
        t | 1
      );

    t ^=
      t +
      Math.imul(
        t ^ (t >>> 7),
        t | 61
      );

    return (
      (
        t ^ (t >>> 14)
      ) >>> 0
    ) / 4294967296;
  };
}


function seededShuffle(
  array,
  rng
) {

  const a =
    [...array];

  for (
    let i = a.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        rng() *
        (i + 1)
      );

    [
      a[i],
      a[j]
    ] =
    [
      a[j],
      a[i]
    ];
  }

  return a;
}


/* =========================================================
   5. 被験者ID hash
========================================================= */

function hashString(text) {

  let hash =
    2166136261;

  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    hash ^=
      text.charCodeAt(i);

    hash =
      Math.imul(
        hash,
        16777619
      );
  }

  return hash >>> 0;
}


/* =========================================================
   6. 18種類の対応表
========================================================= */

function hammingDistance(
  a,
  b
) {

  let distance = 0;

  for (
    let i = 0;
    i < a.length;
    i++
  ) {

    if (
      a[i] !== b[i]
    ) {

      distance++;
    }
  }

  return distance;
}


/*
  各フォームの対応関係が
  互いにできるだけ異なるようにする
*/
function createForms() {

  const rng =
    mulberry32(
      MASTER_SEED
    );

  const permutations = [];

  let attempts = 0;

  while (
    permutations.length <
      N_FORMS
    &&
    attempts < 100000
  ) {

    attempts++;

    const candidate =
      seededShuffle(
        DIGITS,
        rng
      );

    const acceptable =
      permutations.every(
        existing =>
          hammingDistance(
            existing,
            candidate
          ) >= 6
      );

    if (
      acceptable
    ) {

      permutations.push(
        candidate
      );
    }
  }


  if (
    permutations.length <
      N_FORMS
  ) {

    throw new Error(
      "18種類のフォーム生成に失敗しました。"
    );
  }


  return permutations.map(
    (digits,index) => {

      const map = {};

      SYMBOLS.forEach(
        (symbol,i) => {

          map[symbol] =
            digits[i];
        }
      );

      return {

        formNumber:
          index + 1,

        map:
          map
      };
    }
  );
}


const FORMS =
  createForms();


/* =========================================================
   7. 練習用対応表
========================================================= */

const PRACTICE_MAP = {

  "◆": "1",
  "■": "2",

/* =========================================================
   8. 刺激系列

   3回で同じ基本系列を用いる。

   対応表だけ変えることで、
   刺激系列による難易度差を減らす。
========================================================= */

function createBalancedSequence(
  seed,
  length
) {

  const rng =
    mulberry32(seed);

  const sequence = [];

  while (
    sequence.length < length
  ) {

    const cycle =
      seededShuffle(
        SYMBOLS,
        rng
      );

    sequence.push(
      ...cycle
    );
  }

  return sequence.slice(
    0,
    length
  );
}


/*
  90秒で十分余裕がある長さ
*/
const MAIN_SEQUENCE =

const PRACTICE_SEQUENCE =

/* =========================================================
   9. 被験者ごとのセット割付
========================================================= */

/*
  18フォームを

  Set1 = Form 1～3
  Set2 = Form 4～6
  ...
  Set6 = Form16～18

  に分ける。

  被験者IDによって
  測定時点との対応をずらす。
*/

function createParticipantSetOrder(
  participant
) {

  const offset =
    hashString(
      participant
    ) % 6;

  const order = [];

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    order.push(
      (
        offset +
        i
      ) % 6
      + 1
    );
  }

  return order;
}


function getFormIndex(
  blockNumber
) {

  return (
    selectedSetNumber - 1
  ) * 3
  +
  (
    blockNumber - 1
  );
}


/* =========================================================

/* =========================================================
   11. 統計
========================================================= */

function mean(values) {

  if (
    values.length === 0
  ) {
    return NaN;
  }

  return values.reduce(
    (a,b) => a+b,
    0
  ) / values.length;
}


function median(values) {

  if (
    values.length === 0
  ) {
    return NaN;
  }

  const sorted =
    [...values]
      .sort(
        (a,b) => a-b
      );

  const middle =
    Math.floor(
      sorted.length / 2
    );

  if (
    sorted.length % 2 === 0
  ) {

    return (
      sorted[middle-1]
      +
      sorted[middle]
    ) / 2;
  }

  return sorted[middle];
}


function sd(values) {

  if (
    values.length < 2
  ) {
    return NaN;
  }

  const m =
    mean(values);

  return Math.sqrt(

    values.reduce(
      (sum,x) =>
        sum +
        Math.pow(
          x-m,
          2
        ),
      0
    )

    /

    (
      values.length - 1
    )
  );
}


/* =========================================================
   12. 結果計算
========================================================= */

function calculateFromData(data) {

  /*
    実際にキー回答した試行だけ
    SDMT回答数として扱う
  */
  const responded =
    data.filter(
      d =>
        d.response !== null
    );


  const totalResponses =
    responded.length;


  const correctCount =
    responded.filter(
      d =>
        d.correct === true
    ).length;


  const incorrectCount =
    responded.filter(
      d =>
        d.correct === false
    ).length;


  const accuracy =
    totalResponses > 0
    ?
      100 *
      correctCount /
      totalResponses
    :
      NaN;


  const errorRate =
    totalResponses > 0
    ?
      100 *
      incorrectCount /
      totalResponses
    :
      NaN;


  /*
    150～5000 msのみを
    RT集計対象とする
  */
  const allRT =
    responded
      .filter(
        d =>
          d.rt !== null
      );


  const validRTData =
    allRT.filter(
      d =>
        d.rt >= 150
        &&
        d.rt <= 5000
    );


  const excludedRTCount =
    allRT.length -
    validRTData.length;


  const validRT =
    validRTData.map(
      d => d.rt
    );


  /*
    正答RT
  */
  const correctRT =
    validRTData
      .filter(
        d =>
          d.correct === true
      )
      .map(
        d =>
          d.rt
      );


  const meanRT =
    mean(validRT);


  const medianRT =
    median(validRT);


  const minRT =
    validRT.length
    ?
      Math.min(...validRT)
    :
      NaN;


  const maxRT =
    validRT.length
    ?
      Math.max(...validRT)
    :
      NaN;


  const sdRT =
    sd(validRT);


  const seRT =
    validRT.length > 0
    ?
      sdRT /
      Math.sqrt(
        validRT.length
      )
    :
      NaN;


  const cvRT =
    Number.isFinite(
      meanRT
    )
    &&
    meanRT !== 0
    ?
      sdRT / meanRT
    :
      NaN;


  const meanCorrectRT =
    mean(
      correctRT
    );


  const sdCorrectRT =
    sd(
      correctRT
    );


  /*
    標準SDMTに最も近い主要スコア
    = 90秒間の正答数
  */
  const rawScore =
    correctCount;


  /*
    補助指標：
    1秒あたりの正答数
  */
  const correctPerSecond =
    correctCount / 90;


  /*
    1分換算
  */
  const correctPerMinute =
    correctCount /
    1.5;


  return {

    total_responses:
      totalResponses,

    correct_count:
      correctCount,

    incorrect_count:
      incorrectCount,

    raw_score:
      rawScore,

    accuracy:
      accuracy,

    error_rate:
      errorRate,

    valid_rt_count:
      validRT.length,

    excluded_rt_count:
      excludedRTCount,

    mean_rt:
      meanRT,

    median_rt:
      medianRT,

    min_rt:
      minRT,

    max_rt:
      maxRT,

    sd_rt:
      sdRT,

    se_rt:
      seRT,

    cv_rt:
      cvRT,

    mean_correct_rt:
      meanCorrectRT,

    sd_correct_rt:
      sdCorrectRT,

    correct_per_second:
      correctPerSecond,

    correct_per_minute:
      correctPerMinute
  };
}


function calculateBlockResults(
  blockNumber
) {

  const data =
    jsPsych.data
      .get()
      .filter({
        task:
          "sdmt_main",
        block:
          blockNumber
      })
      .values();


  return calculateFromData(
    data
  );
}


function calculateOverallResults() {

  const data =
    jsPsych.data
      .get()
      .filter({
        task:
          "sdmt_main"
      })
      .values();


  return calculateFromData(
    data
  );
}


/* =========================================================
   13. 表示
========================================================= */

function formatNumber(
  x,
  digits=1
) {

  if (
    x === undefined
    ||
    x === null
    ||
    !Number.isFinite(x)
  ) {

    return "";
  }


  return Number(x)
    .toFixed(
      digits
    );
}

          ) / 3

      };


      /* ===================================================

      let csv = "";

         Trial-level data
      =================================================== */

        "\n===== Trial level data =====\n";

        "被験者ID,測定時点,block,form,trial_number,symbol,correct_response,response,correct,rt_ms\n";


      const allData =

        jsPsych.data
          .get()
          .filter({
            task:
              "sdmt_main"
          })
          .values();


      allData.forEach(
        d => {

          csv += [

            String(

            ).padStart(

              "0"

            d.response ?? "",

          +

      function addRow(
        name,
        form,

      ) {

        csv += [

          name,

          form,

          formatNumber(
            r.total_responses,
            1
          ),

          formatNumber(
            r.correct_count,
            1
          ),

          formatNumber(
            r.incorrect_count,
            1
          ),

          formatNumber(
            r.raw_score,
            1
          ),

          formatNumber(
            r.accuracy,
            1
          ),

          formatNumber(

            1
          ),

          r.valid_rt_count,

            r.mean_rt,
            1
          ),

          formatNumber(
            r.median_rt,
            1
          ),

          formatNumber(
            r.min_rt,
            1
          ),

          formatNumber(
            r.max_rt,
            1
          ),

          formatNumber(
            r.sd_rt,
            1
          ),

          formatNumber(
            r.se_rt,
            1
          ),

          formatNumber(
            r.cv_rt,
            3
          ),

          formatNumber(
            r.mean_correct_rt,
            1
          ),

          formatNumber(
            r.sd_correct_rt,
            1
          ),

          formatNumber(
            r.correct_per_second,
            3
          ),

          formatNumber(
            r.correct_per_minute,
            2
          )

        ].join(",")
        +
        "\n";
      }


      const form1 =
        FORMS[
          getFormIndex(1)
        ].formNumber;


      const form2 =
        FORMS[

        ].formNumber;


      const form3 =

      addRow(

      );

        r2
      );


      addRow(

        String(form3)
          .padStart(2,"0"),
        r3
      );


      addRow(
        "3回合計",
        "",
        overall
      );


      csv += [

        "3回平均",
        "",

        formatNumber(
          average.total_responses,
          1
        ),

        formatNumber(
          average.correct_count,
          1
        ),

        formatNumber(
          average.incorrect_count,
          1
        ),

        formatNumber(
          average.correct_count,
          1
        ),

        formatNumber(
          average.accuracy,
          1
        ),

        formatNumber(
          average.error_rate,
          1
        ),

        "",

        "",

        formatNumber(
          average.mean_rt,
          1
        ),

        formatNumber(
          average.median_rt,
          1
        ),

        "",

        "",

        formatNumber(
          average.sd_rt,
          1
        ),

        "",

        formatNumber(
          average.cv_rt,
          3
        ),

        formatNumber(
          average.mean_correct_rt,
          1
        ),

        "",

        "",

        ""

      ].join(",")
      +
      "\n";


      /* ===================================================
         CSV保存
      =================================================== */

      const bom =
        new Uint8Array(
          [
            0xEF,
            0xBB,
            0xBF
          ]
        );


      const blob =
        new Blob(

          [
            bom,
            csv
          ],

          {
            type:
              "text/csv;charset=utf-8;"
          }

        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =

        participant_id +

        "_" +

        selectedTimepoint.code +

        "_SDMT_3回結果.csv";


      document.body
        .appendChild(
          link
        );


      link.click();


      document.body
        .removeChild(
          link
        );


      URL.revokeObjectURL(
        url
      );

    }

  });


/* =========================================================
   15. Timeline
========================================================= */

const timeline = [];


/* =========================================================
   16. ID・測定時点
========================================================= */

timeline.push({

  type:
    jsPsychSurveyHtmlForm,

  html: `

    <div class="text">

      <h2>

/* =========================================================

timeline.push({

timeline.push({

    <div class="text">

/* =========================================================
   19. 練習trial
========================================================= */

function createPracticeTrial(
  trialNumber
) {

  const symbol =
    PRACTICE_SEQUENCE[
      trialNumber - 1
    ];


  return {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus: `

      ${keyTableHTML(
        PRACTICE_MAP
      )}

      <div class="symbol">
        ${symbol}
      </div>

      <p>
        対応する数字キーを
        押してください
      </p>

    `,


    choices:
      DIGITS,


    data: {

      task:
        "sdmt_practice",

      block:
        "practice",

      trial_number:
        trialNumber,

      symbol:
        symbol,

      correct_response:
        PRACTICE_MAP[
          symbol
        ]

    },


    on_finish:
    function(data) {

      data.correct =
        data.response ===
        data.correct_response;

    }

  };
}


/*
  標準SDMTの
  「10項目を指導下で実施」に近づけるため、
  練習では正誤を提示する。
*/

function createPracticeFeedback() {

  return {

    type:
      jsPsychHtmlKeyboardResponse,

    stimulus:
    function() {

      const last =

        jsPsych.data
          .get()
          .filter({
            task:
              "sdmt_practice"
          })
          .last(1)
          .values()[0];


      if (
        last.correct
      ) {

        return `

          <div class="text">

            <h2>
              正解です
            </h2>

          </div>

        `;
      }


      return `

        <div class="text">

          <h2>
            正解は
            ${last.correct_response}
            です
          </h2>

        </div>

      `;

    },


    choices:
      "NO_KEYS",


    trial_duration:
      500

  };
}


for (
  let i = 1;
  i <= PRACTICE_TRIALS;
  i++
) {

  timeline.push(
    createPracticeTrial(i)
  );

  timeline.push(
    createPracticeFeedback()
  );
}


/* =========================================================
   20. 練習終了
========================================================= */

timeline.push({

/* =========================================================
   21. Main trial
========================================================= */

function createSDMTMainTrial() {

  return {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus:
    function() {

      /*
        MAIN_SEQUENCEは各Blockで
        0から使用する。

        3回の刺激系列を同じにして
        難易度を揃える。
      */

      const symbol =

        MAIN_SEQUENCE[
          currentSequenceIndex %
          MAIN_SEQUENCE.length
        ];


      currentSequenceIndex++;


      /*
        このtrialで使用した記号を
        trial objectに保存
      */

      window.currentSDMTSymbol =
        symbol;


      return `

        ${keyTableHTML(
          currentMap
        )}

        <div class="symbol">
          ${symbol}
        </div>

        <p style="font-size:20px;">
          対応する数字キーを
          押してください
        </p>

      `;
    },


    choices:
      DIGITS,


    /*
      残り時間を上限にする。

      これにより90秒になったら、
      回答を待ち続けず終了する。
    */

    trial_duration:
    function() {

      const remaining =

        MAIN_DURATION_MS
        -
        (
          performance.now()
          -
          taskStartTime
        );


      return Math.max(
        1,
        remaining
      );
    },


    response_ends_trial:
      true,


    data:
    function() {

      blockTrialNumber++;


      const symbol =
        window.currentSDMTSymbol;


      return {

        task:
          "sdmt_main",

        block:
          currentBlock,

        form_number:
          currentFormNumber,

        trial_number:
          blockTrialNumber,

        symbol:
          symbol,

        correct_response:
          currentMap[
            symbol
          ]

      };

    },


    on_finish:
    function(data) {

      /*
        90秒到達時の無反応trialは
        回答数には含めない
      */

      if (
        data.response === null
      ) {

        data.correct =
          null;

        data.cutoff_trial =
          true;

        return;
      }


      data.correct =
        data.response ===
        data.correct_response;


      data.cutoff_trial =
        false;

    }

  };
}


/* =========================================================
   22. 休憩
========================================================= */

function createBreakScreen(
  blockNumber
) {

  return {

    type:
      jsPsychHtmlKeyboardResponse,


    stimulus: `

      <div class="text">

        <h2>
          本試行 ${blockNumber} 回目終了
        </h2>

        <p>
          次は本試行
          ${blockNumber + 1}
          回目です。
        </p>

        <p>
          1分間休憩してください。
        </p>

        <div
          id="countdown"
          class="countdown"
        >
          60
        </div>

        <p>
          秒
        </p>

        <p>
          60秒後に
          自動的に次の本試行へ進みます。
        </p>

      </div>

    `,


    choices:
      "NO_KEYS",


    trial_duration:
      BREAK_DURATION_MS,


    on_load:
    function() {

      let remaining =
        60;


      const timer =
        setInterval(
          function() {

            remaining--;


            const el =
              document
                .getElementById(
                  "countdown"
                );


            if (
              el
            ) {

              el.textContent =
                Math.max(
                  remaining,
                  0
                );

            }


            if (
              remaining <= 0
            ) {

              clearInterval(
                timer
              );

            }

          },

          1000
        );

    }

  };
}


/* =========================================================
   23. Main block
========================================================= */

function addMainBlock(
  blockNumber
) {


  /*
    Form設定
  */

  timeline.push({

    type:
      jsPsychHtmlKeyboardResponse,

    stimulus:
      "",

    choices:
      "NO_KEYS",

    trial_duration:
      1,

    on_start:
    function() {

      currentBlock =
        blockNumber;


      const formIndex =
        getFormIndex(
          blockNumber
        );


      const form =
        FORMS[
          formIndex
        ];


      currentFormNumber =
        form.formNumber;


      currentMap =
        form.map;


      /*
        3回とも
        同じ系列の先頭から開始
      */

      currentSequenceIndex =
        0;


      blockTrialNumber =
        0;

    }

  });


  /*
    対応表確認画面

    各フォームで同じ条件にする。
  */

  timeline.push({

    type:
      jsPsychHtmlKeyboardResponse,

    stimulus:
    function() {

      return `

        <div class="text">

          <h2>
            本試行 ${blockNumber} 回目
          </h2>

          <p>
            この回では
            以下の対応表を使用します。
          </p>

          ${keyTableHTML(
            currentMap
          )}

          <p>
            本試行は90秒間です。
          </p>

          <p>
            できるだけ速く、
            正確に回答してください。
          </p>

          <p>
            スペースキーを押すと
            開始します。
          </p>

        </div>

      `;

    },


    choices:
      [" "],


    on_finish:
    function() {

      taskStartTime =
        performance.now();

    }

  });


  /*
    90秒間繰り返し
  */

  timeline.push({

    timeline: [
      createSDMTMainTrial()
    ],


    loop_function:
    function() {

      const elapsed =

        performance.now()
        -
        taskStartTime;


      return (
        elapsed <
        MAIN_DURATION_MS
      );

    }

  });


  /*
    Block1・2の後のみ休憩
  */

  if (
    blockNumber < 3
  ) {

    timeline.push(
      createBreakScreen(
        blockNumber
      )
    );
  }

}


addMainBlock(1);

addMainBlock(2);

addMainBlock(3);
