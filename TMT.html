/* =========================================================
   7. Seed付き乱数
========================================================= */


function mulberry32(seed) {

  return function() {

    let t =

      seed +=
      0x6D2B79F5;


    t =

      Math.imul(

        t ^
        (
          t >>> 15
        ),

        t | 1

      );


    t ^=

      t +

      Math.imul(

        t ^
        (
          t >>> 7
        ),

        t | 61

      );


    return (

      (
        t ^
        (
          t >>> 14
        )
      )

      >>> 0

    )

    /

    4294967296;

  };

}


/* =========================================================
   8. 文字列hash
========================================================= */


function hashString(text) {

  let hash =
    2166136261;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    hash ^=

      text.charCodeAt(i);


    hash =

      Math.imul(

        hash,

        16777619

      );

  }


  return hash >>> 0;

}


/* =========================================================
   9. Seed付きshuffle
========================================================= */


function seededShuffle(
  array,
  rng
) {

  const result =
    [...array];


  for (

    let i =
      result.length - 1;

    i > 0;

    i--

  ) {

    const j =

      Math.floor(

        rng()
        *
        (
          i + 1
        )

      );


    [
      result[i],
      result[j]
    ]

    =

    [
      result[j],
      result[i]
    ];

  }


  return result;

}


/* =========================================================
   10. 配置指標
========================================================= */


function calculateLayoutMetrics(
  layout
) {

  let totalLength =
    0;


  let maxStep =
    0;


  let totalAbsX =
    0;


  let totalAbsY =
    0;


  const distances =
    [];


  for (

    let i = 1;

    i < layout.length;

    i++

  ) {

    const dx =

      layout[i][0]
      -
      layout[i - 1][0];


    const dy =

      layout[i][1]
      -
      layout[i - 1][1];


    const distance =

      Math.sqrt(

        dx * dx
        +
        dy * dy

      );


    distances.push(
      distance
    );


    totalLength +=
      distance;


    maxStep =

      Math.max(

        maxStep,

        distance

      );


    totalAbsX +=
      Math.abs(dx);


    totalAbsY +=
      Math.abs(dy);

  }


  const meanStep =

    totalLength
    /
    distances.length;


  const variance =

    distances.reduce(

      (sum,d) =>

        sum +

        Math.pow(
          d - meanStep,
          2
        ),

      0

    )

    /

    distances.length;


  return {

    totalLength:
      totalLength,

    meanStep:
      meanStep,

    sdStep:
      Math.sqrt(
        variance
      ),

    maxStep:
      maxStep,

    totalAbsX:
      totalAbsX,

    totalAbsY:
      totalAbsY,

    crossings:
      countCrossings(
        layout
      )

  };

}


/* =========================================================
   11. 線分交差数
========================================================= */


function orientation(
  a,
  b,
  c
) {

  const value =

    (
      b[1] - a[1]
    )

    *

    (
      c[0] - b[0]
    )

    -

    (
      b[0] - a[0]
    )

    *

    (
      c[1] - b[1]
    );


  if (
    Math.abs(value) <
    1e-10
  ) {

    return 0;

  }


  return value > 0
    ?
    1
    :
    2;

}



function segmentsIntersect(
  p1,
  q1,
  p2,
  q2
) {

  const o1 =
    orientation(
      p1,q1,p2
    );


  const o2 =
    orientation(
      p1,q1,q2
    );


  const o3 =
    orientation(
      p2,q2,p1
    );


  const o4 =
    orientation(
      p2,q2,q1
    );


  return (

    o1 !== o2
    &&
    o3 !== o4

  );

}



function countCrossings(
  layout
) {

  let count =
    0;


  for (

    let i = 0;

    i <
      layout.length - 1;

    i++

  ) {


    for (

      let j =
        i + 2;

      j <
        layout.length - 1;

      j++

    ) {


      if (
        Math.abs(
          i - j
        )
        <= 1
      ) {

        continue;

      }


      if (

        segmentsIntersect(

          layout[i],

          layout[i+1],

          layout[j],

          layout[j+1]

        )

      ) {

        count++;

      }

    }

  }


  return count;

}


/* =========================================================
   12. 配置条件
========================================================= */


function validLayout(
  layout
) {

  const minimumStep =
    0.14;


  const maximumStep =
    0.95;


  for (

    let i = 1;

    i < layout.length;

    i++

  ) {

    const dx =

      layout[i][0]
      -
      layout[i-1][0];


    const dy =

      layout[i][1]
      -
      layout[i-1][1];


    const distance =

      Math.sqrt(

        dx * dx
        +
        dy * dy

      );


    if (

      distance <
        minimumStep

      ||

      distance >
        maximumStep

    ) {

      return false;

    }

  }


  return true;

}


/* =========================================================
   13. 配置signature
========================================================= */


function layoutSignature(
  layout
) {

  return layout

    .map(

      p =>

        p[0].toFixed(3)
        +
        ":"
        +
        p[1].toFixed(3)

    )

    .join("|");

}


/* =========================================================
   14. 難易度を揃えた18フォーム生成
========================================================= */


function createMatchedForms(
  seed
) {

  const rng =
    mulberry32(
      seed
    );


  const candidatePool =
    [];


  const signatures =
    new Set();


  for (

    let attempt = 0;

    attempt < 4000;

    attempt++

  ) {

    const candidate =

      seededShuffle(

        POSITION_SLOTS,

        rng

      );


    if (
      !validLayout(
        candidate
      )
    ) {

      continue;

    }


    const signature =

      layoutSignature(
        candidate
      );


    if (
      signatures.has(
        signature
      )
    ) {

      continue;

    }


    signatures.add(
      signature
    );


    candidatePool.push({

      layout:
        candidate,

      metrics:
        calculateLayoutMetrics(
          candidate
        )

    });

  }


  if (
    candidatePool.length <
    N_FORMS
  ) {

    throw new Error(
      "十分なTMTフォームを生成できませんでした。"
    );

  }


  function median(values) {

    const sorted =

      [...values]
      .sort(
        (a,b) => a-b
      );


    const n =
      sorted.length;


    if (
      n % 2 === 0
    ) {

      return (

        sorted[
          n/2 - 1
        ]

        +

        sorted[
          n/2
        ]

      ) / 2;

    }


    return sorted[
      Math.floor(
        n/2
      )
    ];

  }


  const targetMetrics = {

    totalLength:

      median(

        candidatePool.map(

          candidate =>
            candidate
            .metrics
            .totalLength

        )

      ),


    meanStep:

      median(

        candidatePool.map(

          candidate =>
            candidate
            .metrics
            .meanStep

        )

      ),


    sdStep:

      median(

        candidatePool.map(

          candidate =>
            candidate
            .metrics
            .sdStep

        )

      ),


    maxStep:

      median(

        candidatePool.map(

          candidate =>
            candidate
            .metrics
            .maxStep

        )

      ),


    totalAbsX:

      median(

        candidatePool.map(

          candidate =>
            candidate
            .metrics
            .totalAbsX

        )

      ),


    totalAbsY:

      median(

        candidatePool.map(

          candidate =>
            candidate
            .metrics
            .totalAbsY

        )

      ),


    crossings:

      median(

        candidatePool.map(

          candidate =>
            candidate
            .metrics
            .crossings

        )

      )

  };


  function relativeDifference(
    value,
    target
  ) {

    if (
      target === 0
    ) {

      return 0;

    }


    return (

      Math.abs(
        value - target
      )

      /

      Math.abs(
        target
      )

    );

  }


  candidatePool.forEach(

    candidate => {


      const m =
        candidate.metrics;


      candidate.score =

        relativeDifference(
          m.totalLength,
          targetMetrics.totalLength
        ) * 3

        +

        relativeDifference(
          m.meanStep,
          targetMetrics.meanStep
        ) * 2

        +

        relativeDifference(
          m.sdStep,
          targetMetrics.sdStep
        )

        +

        relativeDifference(
          m.maxStep,
          targetMetrics.maxStep
        )

        +

        relativeDifference(
          m.totalAbsX,
          targetMetrics.totalAbsX
        )

        +

        relativeDifference(
          m.totalAbsY,
          targetMetrics.totalAbsY
        )

        +

        relativeDifference(
          m.crossings,
          targetMetrics.crossings
        );

    }

  );


  candidatePool.sort(

    (a,b) =>
      a.score - b.score

  );


  return candidatePool

    .slice(
      0,
      N_FORMS
    )

    .map(

      (
        candidate,
        index
      ) => ({

        formNumber:
          index + 1,

        layout:
          candidate.layout,

        metrics:
          candidate.metrics

      })

    );

}

/* =========================================================
   16. 被験者ごとのセット順
========================================================= */


function createParticipantSetOrder(
  participant
) {

  const offset =

    hashString(
      participant
    )
    %
    6;


  const order =
    [];


  for (
    let i = 0;
    i < 6;
    i++
  ) {

    order.push(

      (
        (
          offset + i
        )
        %
        6
      )

      + 1

    );

  }


  return order;

}


/* =========================================================
   17. 1測定時点で使用する3フォーム
========================================================= */


function getFormsForSession(
  setNumber
) {

  const startIndex =

    (
      setNumber - 1
    )

    *

    FORMS_PER_SESSION;


  return [

    startIndex,

    startIndex + 1,

    startIndex + 2

  ];

}

function startMainTask(
  type,
  repetition
) {


  const formArrayIndex =

    currentSessionForms[
      repetition - 1
    ];


  const form =

    type === "A"

    ?

    formsA[
      formArrayIndex
    ]

    :

    formsB[
      formArrayIndex
    ];


  const labels =

    type === "A"

    ?

    labelsA

    :

    labelsB;


  startTask({

    type:
      type,

    repetition:
      repetition,

    formNumber:
      form.formNumber,

    practice:
      false,

    labels:
      labels,

    layout:
      form.layout,

    layoutMetrics:
      form.metrics,


    onComplete:
    function(result) {


      results.push(
        result
      );


      /*
        A
        ↓
        30秒
        ↓
        B
      */

      if (
        type === "A"
      ) {


        showBreak(

          REST_A_TO_B_SEC,

          `TMT-A ${repetition}回目終了`,

          `次はTMT-B ${repetition}回目です。`,

          function() {

            startMainTask(
              "B",
              repetition
            );

          }

        );


        return;

      }


      /*
        B1/B2
        ↓
        60秒
        ↓
        次のA
      */

      if (

        type === "B"

        &&

        repetition < 3

      ) {


        showBreak(

          REST_B_TO_A_SEC,

          `TMT-B ${repetition}回目終了`,

          `次はTMT-A ${repetition + 1}回目です。`,

          function() {

            startMainTask(

              "A",

              repetition + 1

            );

          }

        );


        return;

      }


      /*

      */

      showResults();

    }

  });

}

function showBreak(

  ).innerHTML = `

    <div class="screen">

        ) {

          );

}


/* =========================================================
   25. TMT本体
========================================================= */


function startTask(config) {


  const {

    type,

    repetition,

    formNumber,

    practice,

    labels,

    layout,

    layoutMetrics,

    onComplete

  } = config;


  document.getElementById(
    "app"
  ).innerHTML = `

    <div id="taskHeader">


      <div id="taskTitle">

        ${

          practice

          ?

          `TMT-${type} 練習`

          :

          `TMT-${type} ${repetition}回目`

        }

      </div>


      <div id="taskMessage">

        ${

          type === "A"

          ?

          "Apple Pencilで「1」から順番につないでください"

          :

          "Apple Pencilで「1」から数字と英字を交互につないでください"

        }

      </div>


      <div class="small">

        「1」に触れた瞬間から
        時間測定を開始します

      </div>

    </div>


    <div id="canvasWrap">

      <canvas id="tmtCanvas"></canvas>

    </div>

  `;


  const canvas =

    document.getElementById(
      "tmtCanvas"
    );


  const ctx =

    canvas.getContext(
      "2d"
    );


  /* ---------------------------------------------------------
     iPad縦向き用canvas
  --------------------------------------------------------- */


  const cssWidth =

    Math.min(

      window.innerWidth - 20,

      760

    );


  const cssHeight =

    Math.min(

      window.innerHeight - 115,

      1040

    );


  const dpr =

    window.devicePixelRatio
    ||
    1;


  canvas.style.width =

    cssWidth +
    "px";


  canvas.style.height =

    cssHeight +
    "px";


  canvas.width =

    cssWidth
    *
    dpr;


  canvas.height =

    cssHeight
    *
    dpr;


  ctx.scale(
    dpr,
    dpr
  );


  /* ---------------------------------------------------------
     実際のターゲット位置
  --------------------------------------------------------- */


  const marginX =
    48;


  const marginY =
    48;


  const points =

    layout.map(

      (
        [x,y],
        index
      ) => ({

        x:

          marginX

          +

          x

          *

          (
            cssWidth
            -
            marginX * 2
          ),


        y:

          marginY

          +

          y

          *

          (
            cssHeight
            -
            marginY * 2
          ),


        label:
          labels[index],


        index:
          index

      })

    );


  /* =========================================================
     状態
  ========================================================= */


  let expectedIndex =
    0;


  let completed =
    false;


  let drawing =
    false;


  let started =
    false;


  let taskStart =
    0;


  let completionTime =
    0;


  let errorCount =
    0;


  let penLiftCount =
    0;


  let totalDistance =
    0;


  let penDownDuration =
    0;


  let penDownStart =
    null;


  let lastPoint =
    null;


  let activeWrongTarget =
    null;


  let segments =
    [];


  let currentSegment =
    [];


  let targetArrivals =
    [];


/* =========================================================
   描画
========================================================= */


function drawScene() {


  ctx.clearRect(

    0,
    0,

    cssWidth,
    cssHeight

  );


  ctx.lineCap =
    "round";


  ctx.lineJoin =
    "round";


  ctx.lineWidth =
    LINE_WIDTH;


  ctx.strokeStyle =
    "#111";


  /* 過去の線 */

  segments.forEach(

    segment => {


      if (
        segment.length < 2
      ) {

        return;

      }


      ctx.beginPath();


      ctx.moveTo(

        segment[0].x,

        segment[0].y

      );


      for (

        let i = 1;

        i < segment.length;

        i++

      ) {


        ctx.lineTo(

          segment[i].x,

          segment[i].y

        );

      }


      ctx.stroke();

    }

  );


  /* 現在描画中の線 */


  if (
    currentSegment.length > 1
  ) {


    ctx.beginPath();


    ctx.moveTo(

      currentSegment[0].x,

      currentSegment[0].y

    );


    for (

      let i = 1;

      i < currentSegment.length;

      i++

    ) {


      ctx.lineTo(

        currentSegment[i].x,

        currentSegment[i].y

      );

    }


    ctx.stroke();

  }


  /* 円 */


  points.forEach(

    (
      point,
      index
    ) => {


      ctx.beginPath();


      ctx.arc(

        point.x,

        point.y,

        TARGET_RADIUS,

        0,

        Math.PI * 2

      );


      if (
        index < expectedIndex
      ) {


        ctx.fillStyle =
          "#eeeeee";

      }

      else {


        ctx.fillStyle =
          "white";

      }


      ctx.fill();


      ctx.strokeStyle =
        "#111";


      ctx.lineWidth =
        2;


      ctx.stroke();


      ctx.fillStyle =
        "#111";


      let fontSize =
        19;


      if (
        point.label.length >= 2
      ) {

        fontSize =
          16;

      }


      ctx.font =

        `bold ${fontSize}px Arial`;


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";


      ctx.fillText(

        point.label,

        point.x,

        point.y

      );

    }

  );

}


drawScene();


/* =========================================================
   Pointer座標
========================================================= */


function getPointerPosition(e) {


  const rect =

    canvas
      .getBoundingClientRect();


  return {

    x:
      e.clientX
      -
      rect.left,

    y:
      e.clientY
      -
      rect.top

  };

}


/* =========================================================
   ターゲット検索
========================================================= */


function findTargetAt(
  x,
  y
) {


  for (

    let i = 0;

    i < points.length;

    i++

  ) {


    const dx =

      x
      -
      points[i].x;


    const dy =

      y
      -
      points[i].y;


    const distance =

      Math.sqrt(

        dx * dx
        +
        dy * dy

      );


    if (
      distance <= TARGET_RADIUS
    ) {

      return i;

    }

  }


  return -1;

}


/* =========================================================
   Apple Pencil判定
========================================================= */


function pointerAllowed(e) {


  if (
    e.pointerType === "pen"
  ) {

    return true;

  }


  if (

    ALLOW_MOUSE_FOR_DEBUG

    &&

    e.pointerType === "mouse"

  ) {

    return true;

  }


  if (
    !REQUIRE_PEN
  ) {

    return true;

  }


  return false;

}


/* =========================================================
   Event log
========================================================= */


function logEvent(
  eventType,
  extra = {}
) {


  if (
    practice
  ) {

    return;

  }


  eventLog.push({

    participant_id:
      participantID,

    timepoint_code:
      selectedTimepoint.code,

    timepoint_name:
      selectedTimepoint.name,

    set_number:
      selectedSetNumber,

    test:
      type,

    repetition:
      repetition,

    form_number:
      formNumber,

    event:
      eventType,

    elapsed_ms:

      started

      ?

      performance.now()
      -
      taskStart

      :

      0,

    ...extra

  });

}


/* =========================================================
   正しいターゲット到達
========================================================= */


function registerCorrectTarget(
  index
) {


  const point =
    points[index];


  const elapsed =

    performance.now()
    -
    taskStart;


  targetArrivals.push({

    order:
      index + 1,

    label:
      point.label,

    elapsed_ms:
      elapsed,

    x:
      point.x,

    y:
      point.y

  });


  logEvent(

    "target_hit",

    {

      target_order:
        index + 1,

      target_label:
        point.label,

      x:
        point.x,

      y:
        point.y

    }

  );


  expectedIndex++;


  /*
    最終ターゲット到達
  */

  if (
    expectedIndex >= points.length
  ) {


    completed =
      true;


    /*
      1への接触
      ↓
      最終ターゲット到達

      の完遂時間
    */

    completionTime =

      performance.now()
      -
      taskStart;


    if (

      drawing

      &&

      penDownStart !== null

    ) {


      penDownDuration +=

        performance.now()
        -
        penDownStart;


      penDownStart =
        null;

    }


    drawing =
      false;


    if (
      currentSegment.length > 0
    ) {


      segments.push(
        currentSegment
      );

    }


    currentSegment =
      [];


    drawScene();


    setTimeout(

      finishTask,

      250

    );

  }

}


/* =========================================================
   Error
========================================================= */


function registerError(
  targetIndex
) {


  /*
    同じ誤ターゲット上を
    動いている間は1エラーとする
  */

  if (
    targetIndex === activeWrongTarget
  ) {

    return;

  }


  activeWrongTarget =
    targetIndex;


  errorCount++;


  logEvent(

    "error",

    {

      expected_label:

        points[
          expectedIndex
        ]
        ?.label
        ||
        "",


      touched_label:

        points[
          targetIndex
        ]
        ?.label
        ||
        ""

    }

  );


  const message =

    document.getElementById(
      "taskMessage"
    );


  if (
    message
  ) {


    message.textContent =

      "順番が違います。直前の正しい位置から続けてください。";


    setTimeout(

      function() {


        const element =

          document.getElementById(
            "taskMessage"
          );


        if (
          element
        ) {


          element.textContent =

            type === "A"

            ?

            "Apple Pencilで「1」から順番につないでください"

            :

            "Apple Pencilで「1」から数字と英字を交互につないでください";

        }

      },

      850

    );

  }

}


/* =========================================================
   Pointer Down

   ★ 最重要
   Apple Pencilが最初の「1」に触れた瞬間を
   測定開始時刻とする
========================================================= */


canvas.addEventListener(

  "pointerdown",

  function(e) {


    e.preventDefault();


    if (

      completed

      ||

      !pointerAllowed(e)

    ) {

      return;

    }


    const pos =

      getPointerPosition(e);


    const targetIndex =

      findTargetAt(

        pos.x,

        pos.y

      );


    /* =====================================================
       開始前
    ===================================================== */


    if (
      !started
    ) {


      /*
        最初のターゲット以外では
        測定開始しない
      */

      if (
        targetIndex !== 0
      ) {


        const message =

          document.getElementById(
            "taskMessage"
          );


        if (
          message
        ) {


          message.textContent =

            `最初は ${points[0].label} から開始してください`;

        }


        return;

      }


      /*
        ★ Apple Pencilが
        「1」に触れたこの瞬間を0 msにする
      */

      const startTimestamp =

        performance.now();


      started =
        true;


      taskStart =
        startTimestamp;


      drawing =
        true;


      /*
        接触開始時刻も
        完全に同じtimestamp
      */

      penDownStart =
        startTimestamp;


      currentSegment = [

        {

          x:
            points[0].x,

          y:
            points[0].y

        }

      ];


      lastPoint = {

        x:
          points[0].x,

        y:
          points[0].y

      };


      /*
        最初の1を
        正答ターゲットとして登録
      */

      registerCorrectTarget(
        0
      );


      logEvent(

        "task_start",

        {
          start_label:
            points[0].label
        }

      );


      drawScene();


      return;

    }


    /* =====================================================
       離筆後の再開
    ===================================================== */


    const previousIndex =

      expectedIndex - 1;


    /*
      直前に正しく到達した円から
      再開させる
    */

    if (

      previousIndex >= 0

      &&

      targetIndex !== previousIndex

    ) {


      const message =

        document.getElementById(
          "taskMessage"
        );


      if (
        message
      ) {


        message.textContent =

          `直前の ${points[previousIndex].label} から再開してください`;

      }


      return;

    }


    drawing =
      true;


    penDownStart =

      performance.now();


    currentSegment = [

      {

        x:
          points[
            previousIndex
          ].x,

        y:
          points[
            previousIndex
          ].y

      }

    ];


    lastPoint = {

      x:
        points[
          previousIndex
        ].x,

      y:
        points[
          previousIndex
        ].y

    };


    logEvent(

      "pen_down",

      {

        resume_label:

          points[
            previousIndex
          ].label

      }

    );

  }

);


/* =========================================================
   Pointer Move
========================================================= */


canvas.addEventListener(

  "pointermove",

  function(e) {


    e.preventDefault();


    if (

      !drawing

      ||

      completed

      ||

      !pointerAllowed(e)

    ) {

      return;

    }


    const pos =

      getPointerPosition(e);


    /*
      描画距離
    */

    if (
      lastPoint
    ) {


      const dx =

        pos.x
        -
        lastPoint.x;


      const dy =

        pos.y
        -
        lastPoint.y;


      const distance =

        Math.sqrt(

          dx * dx
          +
          dy * dy

        );


      if (
        distance >= 2
      ) {


        totalDistance +=
          distance;


        currentSegment.push({

          x:
            pos.x,

          y:
            pos.y

        });


        lastPoint = {

          x:
            pos.x,

          y:
            pos.y

        };

      }

    }


    const targetIndex =

      findTargetAt(

        pos.x,

        pos.y

      );


    /*
      円の外
    */

    if (
      targetIndex === -1
    ) {


      activeWrongTarget =
        null;

    }


    /*
      次の正しいターゲット
    */

    else if (
      targetIndex === expectedIndex
    ) {


      activeWrongTarget =
        null;


      registerCorrectTarget(
        targetIndex
      );

    }


    /*
      まだ到達すべきでない
      ターゲットに接触
    */

    else if (
      targetIndex > expectedIndex
    ) {


      registerError(
        targetIndex
      );

    }


    drawScene();

  }

);


/* =========================================================
   Pointer Up
========================================================= */


function pointerEnd(e) {


  e.preventDefault();


  /*
    開始前の離筆は
    カウントしない
  */

  if (
    !started
  ) {

    return;

  }


  if (

    !drawing

    ||

    completed

  ) {

    return;

  }


  drawing =
    false;


  if (
    penDownStart !== null
  ) {


    penDownDuration +=

      performance.now()
      -
      penDownStart;


    penDownStart =
      null;

  }


  if (
    currentSegment.length > 0
  ) {


    segments.push(
      currentSegment
    );

  }


  currentSegment =
    [];


  lastPoint =
    null;


  /*
    開始後の離筆のみカウント
  */

  penLiftCount++;


  logEvent(

    "pen_lift",

    {

      pen_lift_count:
        penLiftCount

    }

  );


  drawScene();

}


canvas.addEventListener(

  "pointerup",

  pointerEnd

);


canvas.addEventListener(

  "pointercancel",

  pointerEnd

);


/* =========================================================
   課題終了
========================================================= */


function finishTask() {


  if (
    practice
  ) {


    onComplete();

    return;

  }


  const averagePenSpeed =

    penDownDuration > 0

    ?

    totalDistance

    /

    (
      penDownDuration / 1000
    )

    :

    0;


  /*
    完遂時間から
    Apple Pencil接触時間を引いた時間
  */

  const pauseTime =

    completionTime
    -
    penDownDuration;


  const result = {


    participant_id:
      participantID,


    timepoint_code:
      selectedTimepoint.code,


    timepoint_name:
      selectedTimepoint.name,


    set_number:
      selectedSetNumber,


    test:
      type,


    repetition:
      repetition,


    form_number:
      formNumber,


    completion_ms:
      completionTime,


    completion_sec:

      completionTime
      /
      1000,


    errors:
      errorCount,


    pen_lifts:
      penLiftCount,


    total_distance_px:
      totalDistance,


    pen_down_ms:
      penDownDuration,


    pause_ms:
      pauseTime,


    average_pen_speed_px_sec:
      averagePenSpeed,


    target_arrivals:
      targetArrivals,


    layout_metrics:
      layoutMetrics || {}

  };


  onComplete(
    result
  );

}

}


/* =========================================================
   26. 結果取得
========================================================= */


function getResult(
  type,
  repetition
) {


  return results.find(

    result =>

      result.test === type

      &&

      result.repetition === repetition

  );

}


/* =========================================================
   27. Mean
========================================================= */


function mean(values) {


  const valid =

    values.filter(

      value =>
        Number.isFinite(
          value
        )

    );


  if (
    valid.length === 0
  ) {

    return NaN;

  }


  return (

    valid.reduce(

      (a,b) =>
        a+b,

      0

    )

    /

    valid.length

  );

}


/* =========================================================
   28. Format
========================================================= */


function format(
  value,
  digits = 2
) {


  if (
    !Number.isFinite(
      value
    )
  ) {

    return "";

  }


  return Number(
    value
  ).toFixed(
    digits
  );

}


/* =========================================================
   29. Log(B/A)
========================================================= */


function calculateLogRatio(
  A,
  B
) {


  if (

    !Number.isFinite(A)

    ||

    !Number.isFinite(B)

    ||

    A <= 0

    ||

    B <= 0

  ) {

    return NaN;

  }


  /*
    Natural logarithm
  */

  return Math.log(
    B / A
  );

}

/* =========================================================
   31. CSV escape
========================================================= */


function csvEscape(value) {


  if (
    value === null
    ||
    value === undefined
  ) {

    return "";

  }


  let text =
    String(value);


  if (

    text.includes(",")

    ||

    text.includes('"')

    ||

    text.includes("\n")

  ) {


    text =

      '"'

      +

      text.replace(
        /"/g,
        '""'
      )

      +

      '"';

  }


  return text;

}
