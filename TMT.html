const POSITION_SLOTS = [

/* =========================================================
   7. Seed付き乱数
   ========================================================= */

function mulberry32(seed) {

  return function() {

    let t =
      seed +=
      0x6D2B79F5;

    t =
      Math.imul(
        t ^
        t >>> 15,
        t | 1
      );

    t ^=
      t +
      Math.imul(
        t ^
        t >>> 7,
        t | 61
      );

    return (
      (
        t ^
        t >>> 14
      ) >>> 0
    ) / 4294967296;
  };
}


/* =========================================================
   8. 文字列ハッシュ
   ========================================================= */

function hashString(text) {

  let hash =
    2166136261;

  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    hash ^=
      text.charCodeAt(i);

    hash =
      Math.imul(
        hash,
        16777619
      );
  }

  return hash >>> 0;
}


/* =========================================================
   9. Seed付きshuffle
   ========================================================= */

function seededShuffle(
  array,
  rng
) {

  const result =
    [...array];

  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        rng() *
        (i + 1)
      );

    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];
  }

  return result;
}


/* =========================================================
   10. 経路指標
   ========================================================= */

function calculateLayoutMetrics(
  layout
) {

  let totalLength = 0;

  let maxStep = 0;

  let totalAbsX = 0;

  let totalAbsY = 0;

  const distances = [];


  for (
    let i = 1;
    i < layout.length;
    i++
  ) {

    const dx =
      layout[i][0] -
      layout[i - 1][0];

    const dy =
      layout[i][1] -
      layout[i - 1][1];

    const d =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    distances.push(d);

    totalLength += d;

    maxStep =
      Math.max(
        maxStep,
        d
      );

    totalAbsX +=
      Math.abs(dx);

    totalAbsY +=
      Math.abs(dy);
  }


  const meanStep =
    totalLength /
    distances.length;


  const variance =
    distances.reduce(
      (sum,d) =>
        sum +
        Math.pow(
          d - meanStep,
          2
        ),
      0
    ) /
    distances.length;


  return {

    totalLength:
      totalLength,

    meanStep:
      meanStep,

    sdStep:
      Math.sqrt(
        variance
      ),

    maxStep:
      maxStep,

    totalAbsX:
      totalAbsX,

    totalAbsY:
      totalAbsY,

    crossings:
      countCrossings(
        layout
      )

  };
}


/* =========================================================
   11. 線分交差
   ========================================================= */

function orientation(
  a,b,c
) {

  const value =
    (
      b[1] - a[1]
    ) *
    (
      c[0] - b[0]
    )
    -
    (
      b[0] - a[0]
    ) *
    (
      c[1] - b[1]
    );

  if (
    Math.abs(value) <
    1e-10
  ) {
    return 0;
  }

  return value > 0
    ? 1
    : 2;
}


function segmentsIntersect(
  p1,q1,p2,q2
) {

  const o1 =
    orientation(
      p1,q1,p2
    );

  const o2 =
    orientation(
      p1,q1,q2
    );

  const o3 =
    orientation(
      p2,q2,p1
    );

  const o4 =
    orientation(
      p2,q2,q1
    );

  return (
    o1 !== o2 &&
    o3 !== o4
  );
}


function countCrossings(
  layout
) {

  let count = 0;

  for (
    let i = 0;
    i <
    layout.length - 1;
    i++
  ) {

    for (
      let j =
        i + 2;

      j <
        layout.length - 1;

      j++
    ) {

      /*
        隣接線分は除外
      */

      if (
        Math.abs(i-j) <= 1
      ) {
        continue;
      }

      if (
        segmentsIntersect(
          layout[i],
          layout[i+1],
          layout[j],
          layout[j+1]
        )
      ) {

        count++;
      }
    }
  }

  return count;
}


/* =========================================================
   12. 極端に簡単な配置を除外
   ========================================================= */

function validLayout(
  layout
) {

  const minimumStep =
    0.14;

  const maximumStep =
    0.95;


  for (
    let i = 1;
    i < layout.length;
    i++
  ) {

    const dx =
      layout[i][0] -
      layout[i-1][0];

    const dy =
      layout[i][1] -
      layout[i-1][1];

    const d =
      Math.sqrt(
        dx*dx +
        dy*dy
      );


    if (
      d < minimumStep ||
      d > maximumStep
    ) {

      return false;
    }
  }

  return true;
}


/* =========================================================
   13. 配置signature
   ========================================================= */

function layoutSignature(
  layout
) {

  return layout
    .map(
      p =>
        p[0].toFixed(3) +
        ":" +
        p[1].toFixed(3)
    )
    .join("|");
}


/* =========================================================
   14. 18フォーム候補生成
   ========================================================= */

function createMatchedForms(
  seed
) {

  const rng =
    mulberry32(
      seed
    );


  const candidatePool = [];

  const signatures =
    new Set();


  /*
    多数の候補を作る
  */

  for (
    let attempt = 0;
    attempt < 3000;
    attempt++
  ) {

    const candidate =
      seededShuffle(
        POSITION_SLOTS,
        rng
      );


    if (
      !validLayout(
        candidate
      )
    ) {
      continue;
    }


    const signature =
      layoutSignature(
        candidate
      );


    if (
      signatures.has(
        signature
      )
    ) {
      continue;
    }


    signatures.add(
      signature
    );


    candidatePool.push({

      layout:
        candidate,

      metrics:
        calculateLayoutMetrics(
          candidate
        )

    });
  }


  if (
    candidatePool.length <
    N_FORMS
  ) {

    throw new Error(
      "十分なTMT配置を生成できませんでした。"
    );
  }


  /*
    中央値
  */

  function median(values) {

    const sorted =
      [...values]
      .sort(
        (a,b) =>
          a-b
      );

    const n =
      sorted.length;

    if (
      n % 2 === 0
    ) {

      return (
        sorted[n/2-1] +
        sorted[n/2]
      ) / 2;

    }

    return sorted[
      Math.floor(
        n/2
      )
    ];
  }


  const targetMetrics = {

    totalLength:
      median(
        candidatePool.map(
          c =>
            c.metrics.totalLength
        )
      ),

    meanStep:
      median(
        candidatePool.map(
          c =>
            c.metrics.meanStep
        )
      ),

    sdStep:
      median(
        candidatePool.map(
          c =>
            c.metrics.sdStep
        )
      ),

    maxStep:
      median(
        candidatePool.map(
          c =>
            c.metrics.maxStep
        )
      ),

    totalAbsX:
      median(
        candidatePool.map(
          c =>
            c.metrics.totalAbsX
        )
      ),

    totalAbsY:
      median(
        candidatePool.map(
          c =>
            c.metrics.totalAbsY
        )
      ),

    crossings:
      median(
        candidatePool.map(
          c =>
            c.metrics.crossings
        )
      )

  };


  /*
    中央的な難易度への距離
  */

  function relativeDifference(
    value,
    target
  ) {

    if (
      target === 0
    ) {
      return 0;
    }

    return (
      Math.abs(
        value-target
      ) /
      Math.abs(target)
    );
  }


  candidatePool.forEach(
    candidate => {

      const m =
        candidate.metrics;

      candidate.score =

        relativeDifference(
          m.totalLength,
          targetMetrics.totalLength
        ) * 3

        +

        relativeDifference(
          m.meanStep,
          targetMetrics.meanStep
        ) * 2

        +

        relativeDifference(
          m.sdStep,
          targetMetrics.sdStep
        )

        +

        relativeDifference(
          m.maxStep,
          targetMetrics.maxStep
        )

        +

        relativeDifference(
          m.totalAbsX,
          targetMetrics.totalAbsX
        )

        +

        relativeDifference(
          m.totalAbsY,
          targetMetrics.totalAbsY
        )

        +

        relativeDifference(
          m.crossings,
          targetMetrics.crossings
        );

    }
  );


  candidatePool.sort(
    (a,b) =>
      a.score -
      b.score
  );


  /*
    上位18フォーム採用
  */

  return candidatePool
    .slice(
      0,
      N_FORMS
    )
    .map(
      (candidate,index) => ({

        formNumber:
          index + 1,

        layout:
          candidate.layout,

        metrics:
          candidate.metrics

      })
    );
}


/* =========================================================
   15. A01～A18 / B01～B18生成

/* =========================================================
   16. 被験者ごとの6セット提示順
   ========================================================= */

/*
  フォームを3個ずつ6セットにする。

  Set 1 = Forms 1-3
  Set 2 = Forms 4-6
  ...
  Set 6 = Forms 16-18

  被験者IDによって開始Setをずらす。

  例

  被験者A:
  1,2,3,4,5,6

  被験者B:
  2,3,4,5,6,1

  ...
*/

function createParticipantSetOrder(
  participant
) {

  const offset =
    hashString(
      participant
    ) % 6;


  const order = [];

  for (
    let i=0;
    i<6;
    i++
  ) {

    order.push(
      (
        offset +
        i
      ) % 6
      + 1
    );
  }

  return order;
}


/* =========================================================
   17. 該当測定時点の3フォーム
   ========================================================= */

function getFormsForSession(
  setNumber
) {

  const startIndex =
    (
      setNumber - 1
    ) *
    FORMS_PER_SESSION;


  return [
    startIndex,
    startIndex + 1,
    startIndex + 2
  ];
}

/* =========================================================
   23. 本試行
   ========================================================= */

function startMainTask(
  type,
  repetition
) {

  /*
    この測定時点で使用する
    3フォームのうち何番目か
  */

  const formArrayIndex =
    currentSessionForms[
      repetition - 1
    ];


  const form =
    type === "A"
      ?
      formsA[
        formArrayIndex
      ]
      :
      formsB[
        formArrayIndex
      ];


  const labels =
    type === "A"
      ?
      labelsA
      :
      labelsB;


  startTask({

    type:
      type,

    repetition:
      repetition,

    formNumber:
      form.formNumber,

    practice:
      false,

    labels:
      labels,

    layout:
      form.layout,

    layoutMetrics:
      form.metrics,


    onComplete:
      function(result) {

        results.push(
          result
        );


        /*
          A終了 → B
        */

        if (
          type === "A"
        ) {

          showBreak(

            REST_A_TO_B_SEC,

            `TMT-A ${repetition}回目終了`,

            `次はTMT-B ${repetition}回目です。`,

            function() {

              startMainTask(
                "B",
                repetition
              );
            }

          );

          return;
        }


        /*
          B1/B2終了
          → 60秒休憩
          → 次のA
        */

        if (
          type === "B" &&
          repetition < 3
        ) {

          showBreak(

            REST_B_TO_A_SEC,

            `TMT-B ${repetition}回目終了`,

            `次はTMT-A ${repetition + 1}回目です。`,

            function() {

              startMainTask(
                "A",
                repetition + 1
              );
            }

          );

          return;
        }


        /*
          B3終了
        */

        showResults();
      }

  });
}

function showBreak(
  seconds,
  title,
  nextText,
  callback
) {

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="screen">

      <h2>
        ${title}
      </h2>

      <p>
        ${nextText}
      </p>

      <p>
        休憩してください。
      </p>

      <div
        id="breakCountdown"
        class="countdown"
      >
        ${seconds}
      </div>

      <p>
        秒
      </p>

      <p class="small">
        0秒になると
        自動的に次の課題を開始します。
      </p>

    </div>

  `;


  let remaining =
    seconds;


  const interval =
    setInterval(
      function() {

        remaining -= 1;


        const element =
          document.getElementById(
            "breakCountdown"
          );


        if (element) {

          element.textContent =
            remaining;
        }


        if (
          remaining <= 0
        ) {

          clearInterval(
            interval
          );

          callback();
        }

      },
      1000
    );
}


/* =========================================================
   25. 課題本体
   ========================================================= */

function startTask(config) {

  const {

    type,
    repetition,
    formNumber,
    practice,
    labels,
    layout,
    layoutMetrics,
    onComplete

  } = config;


  document.getElementById(
    "app"
  ).innerHTML = `

    <div id="taskHeader">

      <div id="taskTitle">

        ${
          practice
          ?
          `TMT-${type} 練習`
          :
          `TMT-${type} ${repetition}回目`
        }

      </div>

      <div id="taskMessage">

        ${
          type === "A"
          ?
          "Apple Pencilで1から順番につないでください"
          :
          "Apple Pencilで数字と英字を交互につないでください"
        }

      </div>

    </div>


    <div id="canvasWrap">

      <canvas
        id="tmtCanvas"
      ></canvas>

    </div>

  `;


  const canvas =
    document.getElementById(
      "tmtCanvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  /* ---------------------------------------------------------
     iPad縦向きサイズ
     --------------------------------------------------------- */

  const cssWidth =
    Math.min(
      window.innerWidth - 20,
      760
    );


  const cssHeight =
    Math.min(
      window.innerHeight - 100,
      1040
    );


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.style.width =
    cssWidth +
    "px";


  canvas.style.height =
    cssHeight +
    "px";


  canvas.width =
    cssWidth *
    dpr;


  canvas.height =
    cssHeight *
    dpr;


  ctx.scale(
    dpr,
    dpr
  );


  /* ---------------------------------------------------------
     実座標
     --------------------------------------------------------- */

  const marginX =
    48;

  const marginY =
    48;


  const points =
    layout.map(

      ([x,y],index) => ({

        x:
          marginX +
          x *
          (
            cssWidth -
            marginX * 2
          ),

        y:
          marginY +
          y *
          (
            cssHeight -
            marginY * 2
          ),

        label:
          labels[index],

        index:
          index

      })

    );


  /* ---------------------------------------------------------
     状態
     --------------------------------------------------------- */

  let expectedIndex =
    0;

  let completed =
    false;

  let drawing =
    false;

  let started =
    false;

  let taskStart =
    0;

  let completionTime =
    0;

  let errorCount =
    0;

  let penLiftCount =
    0;

  let totalDistance =
    0;

  let penDownDuration =
    0;

  let penDownStart =
    null;

  let lastPoint =
    null;

  let activeWrongTarget =
    null;

  let segments =
    [];

  let currentSegment =
    [];

  let targetArrivals =
    [];


  /* =========================================================
     描画
     ========================================================= */

  function drawScene() {

    ctx.clearRect(
      0,
      0,
      cssWidth,
      cssHeight
    );


    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";

    ctx.lineWidth =
      LINE_WIDTH;

    ctx.strokeStyle =
      "#111";


    /*
      過去線
    */

    segments.forEach(
      segment => {

        if (
          segment.length < 2
        ) {
          return;
        }


        ctx.beginPath();

        ctx.moveTo(
          segment[0].x,
          segment[0].y
        );


        for (
          let i = 1;
          i < segment.length;
          i++
        ) {

          ctx.lineTo(
            segment[i].x,
            segment[i].y
          );
        }


        ctx.stroke();
      }
    );


    /*
      現在線
    */

    if (
      currentSegment.length >
      1
    ) {

      ctx.beginPath();

      ctx.moveTo(
        currentSegment[0].x,
        currentSegment[0].y
      );


      for (
        let i = 1;
        i < currentSegment.length;
        i++
      ) {

        ctx.lineTo(
          currentSegment[i].x,
          currentSegment[i].y
        );
      }


      ctx.stroke();
    }


    /*
      円
    */

    points.forEach(
      (point,index) => {

        ctx.beginPath();

        ctx.arc(
          point.x,
          point.y,
          TARGET_RADIUS,
          0,
          Math.PI * 2
        );


        if (
          index <
          expectedIndex
        ) {

          ctx.fillStyle =
            "#eeeeee";

        } else {

          ctx.fillStyle =
            "white";
        }


        ctx.fill();


        ctx.strokeStyle =
          "#111";

        ctx.lineWidth =
          2;

        ctx.stroke();


        ctx.fillStyle =
          "#111";


        let fontSize =
          19;


        if (
          point.label.length >= 2
        ) {

          fontSize =
            16;
        }


        ctx.font =
          `bold ${fontSize}px Arial`;


        ctx.textAlign =
          "center";


        ctx.textBaseline =
          "middle";


        ctx.fillText(
          point.label,
          point.x,
          point.y
        );
      }
    );
  }


  drawScene();


  /* =========================================================
     Pointer座標
     ========================================================= */

  function getPointerPosition(e) {

    const rect =
      canvas
      .getBoundingClientRect();


    return {

      x:
        e.clientX -
        rect.left,

      y:
        e.clientY -
        rect.top

    };
  }


  /* =========================================================
     ターゲット検索
     ========================================================= */

  function findTargetAt(
    x,
    y
  ) {

    for (
      let i=0;
      i<points.length;
      i++
    ) {

      const dx =
        x -
        points[i].x;


      const dy =
        y -
        points[i].y;


      const distance =
        Math.sqrt(
          dx*dx +
          dy*dy
        );


      if (
        distance <=
        TARGET_RADIUS
      ) {

        return i;
      }
    }


    return -1;
  }


  /* =========================================================
     Apple Pencil判定
     ========================================================= */

  function pointerAllowed(e) {

    if (
      e.pointerType ===
      "pen"
    ) {

      return true;
    }


    if (
      ALLOW_MOUSE_FOR_DEBUG &&
      e.pointerType ===
      "mouse"
    ) {

      return true;
    }


    if (
      !REQUIRE_PEN
    ) {

      return true;
    }


    return false;
  }


  /* =========================================================
     Event log
     ========================================================= */

  function logEvent(
    eventType,
    extra={}
  ) {

    if (
      practice
    ) {
      return;
    }


    eventLog.push({

      participant_id:
        participantID,

      timepoint_code:
        selectedTimepoint.code,

      timepoint_name:
        selectedTimepoint.name,

      set_number:
        selectedSetNumber,

      test:
        type,

      repetition:
        repetition,

      form_number:
        formNumber,

      event:
        eventType,

      elapsed_ms:
        started
        ?
        performance.now() -
        taskStart
        :
        0,

      ...extra

    });
  }


  /* =========================================================
     正しいターゲット
     ========================================================= */

  function registerCorrectTarget(
    index
  ) {

    const point =
      points[index];


    const elapsed =
      performance.now() -
      taskStart;


    targetArrivals.push({

      order:
        index + 1,

      label:
        point.label,

      elapsed_ms:
        elapsed,

      x:
        point.x,

      y:
        point.y

    });


    logEvent(
      "target_hit",
      {

        target_order:
          index + 1,

        target_label:
          point.label,

        x:
          point.x,

        y:
          point.y

      }
    );


    expectedIndex +=
      1;


    /*
      最終ターゲット
    */

    if (
      expectedIndex >=
      points.length
    ) {

      completed =
        true;


      completionTime =
        performance.now() -
        taskStart;


      if (
        drawing &&
        penDownStart !== null
      ) {

        penDownDuration +=

          performance.now() -
          penDownStart;


        penDownStart =
          null;
      }


      drawing =
        false;


      if (
        currentSegment.length >
        0
      ) {

        segments.push(
          currentSegment
        );
      }


      currentSegment =
        [];


      drawScene();


      setTimeout(
        finishTask,
        250
      );
    }
  }


  /* =========================================================
     Error
     ========================================================= */

  function registerError(
    targetIndex
  ) {

    if (
      targetIndex ===
      activeWrongTarget
    ) {

      return;
    }


    activeWrongTarget =
      targetIndex;


    errorCount +=
      1;


    logEvent(
      "error",
      {

        expected_label:
          points[
            expectedIndex
          ]?.label || "",

        touched_label:
          points[
            targetIndex
          ]?.label || ""

      }
    );


    const message =
      document
      .getElementById(
        "taskMessage"
      );


    if (message) {

      message.textContent =
        "順番が違います。直前の正しい位置から続けてください。";


      setTimeout(
        function() {

          const m =
            document
            .getElementById(
              "taskMessage"
            );


          if (m) {

            m.textContent =
              type === "A"
              ?
              "Apple Pencilで1から順番につないでください"
              :
              "Apple Pencilで数字と英字を交互につないでください";

          }

        },
        850
      );
    }
  }


  /* =========================================================
     Pointer Down
     ========================================================= */

  canvas.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();


      if (
        completed ||
        !pointerAllowed(e)
      ) {

        return;
      }


      const pos =
        getPointerPosition(e);


      const targetIndex =
        findTargetAt(
          pos.x,
          pos.y
        );


      /*
        開始前
      */

      if (
        !started
      ) {

        if (
          targetIndex !== 0
        ) {

          const message =
            document
            .getElementById(
              "taskMessage"
            );


          if (message) {

            message.textContent =
              `最初は ${points[0].label} から開始してください`;
          }


          return;
        }


        started =
          true;


        taskStart =
          performance.now();


        drawing =
          true;


        penDownStart =
          performance.now();


        currentSegment =
          [
            {
              x:
                points[0].x,

              y:
                points[0].y
            }
          ];


        lastPoint =
          {
            x:
              points[0].x,

            y:
              points[0].y
          };


        registerCorrectTarget(
          0
        );


        drawScene();


        return;
      }


      /*
        離筆後再開
      */

      const previousIndex =
        expectedIndex -
        1;


      if (
        previousIndex >= 0 &&
        targetIndex !==
        previousIndex
      ) {

        const message =
          document
          .getElementById(
            "taskMessage"
          );


        if (message) {

          message.textContent =
            `直前の ${points[previousIndex].label} から再開してください`;
        }


        return;
      }


      drawing =
        true;


      penDownStart =
        performance.now();


      currentSegment =
        [
          {
            x:
              points[
                previousIndex
              ].x,

            y:
              points[
                previousIndex
              ].y
          }
        ];


      lastPoint =
        {

          x:
            points[
              previousIndex
            ].x,

          y:
            points[
              previousIndex
            ].y

        };


      logEvent(
        "pen_down",
        {

          resume_label:
            points[
              previousIndex
            ].label

        }
      );
    }
  );


  /* =========================================================
     Pointer Move
     ========================================================= */

  canvas.addEventListener(
    "pointermove",
    function(e) {

      e.preventDefault();


      if (
        !drawing ||
        completed ||
        !pointerAllowed(e)
      ) {

        return;
      }


      const pos =
        getPointerPosition(e);


      /*
        描画距離
      */

      if (
        lastPoint
      ) {

        const dx =
          pos.x -
          lastPoint.x;


        const dy =
          pos.y -
          lastPoint.y;


        const distance =
          Math.sqrt(
            dx*dx +
            dy*dy
          );


        if (
          distance >= 2
        ) {

          totalDistance +=
            distance;


          currentSegment.push({

            x:
              pos.x,

            y:
              pos.y

          });


          lastPoint =
            {

              x:
                pos.x,

              y:
                pos.y

            };
        }
      }


      /*
        円判定
      */

      const targetIndex =
        findTargetAt(
          pos.x,
          pos.y
        );


      if (
        targetIndex === -1
      ) {

        activeWrongTarget =
          null;

      }


      else if (
        targetIndex ===
        expectedIndex
      ) {

        activeWrongTarget =
          null;


        registerCorrectTarget(
          targetIndex
        );

      }


      else if (
        targetIndex >
        expectedIndex
      ) {

        registerError(
          targetIndex
        );
      }


      drawScene();
    }
  );


  /* =========================================================
     Pointer Up
     ========================================================= */

  function pointerEnd(e) {

    e.preventDefault();


    if (
      !drawing ||
      completed
    ) {

      return;
    }


    drawing =
      false;


    if (
      penDownStart !== null
    ) {

      penDownDuration +=

        performance.now() -
        penDownStart;


      penDownStart =
        null;
    }


    if (
      currentSegment.length >
      0
    ) {

      segments.push(
        currentSegment
      );
    }


    currentSegment =
      [];


    lastPoint =
      null;


    /*
      課題途中の離筆
    */

    penLiftCount +=
      1;


    logEvent(
      "pen_lift",
      {

        pen_lift_count:
          penLiftCount

      }
    );


    drawScene();
  }


  canvas.addEventListener(
    "pointerup",
    pointerEnd
  );


  canvas.addEventListener(
    "pointercancel",
    pointerEnd
  );


  /* =========================================================
     終了
     ========================================================= */

  function finishTask() {

    if (
      practice
    ) {

      onComplete();

      return;
    }


    const averagePenSpeed =
      penDownDuration > 0
      ?
      totalDistance /
      (
        penDownDuration /
        1000
      )
      :
      0;


    const pauseTime =
      completionTime -
      penDownDuration;


    const result = {

      participant_id:
        participantID,

      timepoint_code:
        selectedTimepoint.code,

      timepoint_name:
        selectedTimepoint.name,

      set_number:
        selectedSetNumber,

      test:
        type,

      repetition:
        repetition,

      form_number:
        formNumber,

      completion_ms:
        completionTime,

      completion_sec:
        completionTime /
        1000,

      errors:
        errorCount,

      pen_lifts:
        penLiftCount,

      total_distance_px:
        totalDistance,

      pen_down_ms:
        penDownDuration,

      pause_ms:
        pauseTime,

      average_pen_speed_px_sec:
        averagePenSpeed,

      target_arrivals:
        targetArrivals,

      layout_metrics:
        layoutMetrics || {}

    };


    onComplete(
      result
    );
  }
}


/* =========================================================
   26. 結果取得
   ========================================================= */

function getResult(
  type,
  repetition
) {

  return results.find(
    r =>

      r.test === type &&
      r.repetition === repetition
  );
}


/* =========================================================
   27. Mean
   ========================================================= */

function mean(values) {

  const valid =
    values.filter(
      v =>
        Number.isFinite(v)
    );


  if (
    valid.length === 0
  ) {

    return NaN;
  }


  return (
    valid.reduce(
      (a,b) =>
        a+b,
      0
    )
    /
    valid.length
  );
}


/* =========================================================
   28. Format
   ========================================================= */

function format(
  value,
  digits=2
) {

  if (
    !Number.isFinite(value)
  ) {

    return "";
  }


  return Number(value)
    .toFixed(
      digits
    );
}


/* =========================================================
   29. 結果表示
   ========================================================= */

function showResults() {

  const rows =
    [];


  for (
    let rep=1;
    rep<=3;
    rep++
  ) {

    const A =
      getResult(
        "A",
        rep
      );


    const B =
      getResult(
        "B",
        rep
      );


    rows.push({

      repetition:
        rep,

      A:
        A,

      B:
        B,

      difference:
        B.completion_sec -
        A.completion_sec,

      ratio:
        B.completion_sec /
        A.completion_sec

    });
  }


  const meanA =
    mean(
      rows.map(
        r =>
          r.A.completion_sec
      )
    );


  const meanB =
    mean(
      rows.map(
        r =>
          r.B.completion_sec
      )
    );


  const meanDifference =
    mean(
      rows.map(
        r =>
          r.difference
      )
    );


  const meanRatio =
    mean(
      rows.map(
        r =>
          r.ratio
      )
    );


  document
    .getElementById(
      "app"
    )
    .innerHTML = `

    <div class="screen">

      <h2>
        測定結果
      </h2>

      <p>
        ${selectedTimepoint.name}
      </p>


      <table class="resultTable">

        <tr>

          <th>回</th>

          <th>A form</th>

          <th>A時間</th>

          <th>B form</th>

          <th>B時間</th>

          <th>B−A</th>

          <th>B/A</th>

          <th>A誤</th>

          <th>B誤</th>

          <th>A離筆</th>

          <th>B離筆</th>

        </tr>


        ${
          rows.map(
            r => `

            <tr>

              <td>
                ${r.repetition}
              </td>

              <td>
                A${String(
                  r.A.form_number
                ).padStart(2,"0")}
              </td>

              <td>
                ${format(
                  r.A.completion_sec,
                  2
                )}
              </td>

              <td>
                B${String(
                  r.B.form_number
                ).padStart(2,"0")}
              </td>

              <td>
                ${format(
                  r.B.completion_sec,
                  2
                )}
              </td>

              <td>
                ${format(
                  r.difference,
                  2
                )}
              </td>

              <td>
                ${format(
                  r.ratio,
                  3
                )}
              </td>

              <td>
                ${r.A.errors}
              </td>

              <td>
                ${r.B.errors}
              </td>

              <td>
                ${r.A.pen_lifts}
              </td>

              <td>
                ${r.B.pen_lifts}
              </td>

            </tr>

            `
          ).join("")
        }

      </table>


      <h3>
        3回平均
      </h3>


      <p>
        TMT-A平均：
        ${format(
          meanA,
          2
        )}
        秒
      </p>


      <p>
        TMT-B平均：
        ${format(
          meanB,
          2
        )}
        秒
      </p>


      <p>
        B−A平均：
        ${format(
          meanDifference,
          2
        )}
        秒
      </p>


      <p>
        B/A平均：
        ${format(
          meanRatio,
          3
        )}
      </p>


      <button
        id="downloadButton"
      >
        CSVを保存して終了
      </button>

    </div>

    `;


  document
    .getElementById(
      "downloadButton"
    )
    .addEventListener(
      "click",
      downloadCSV
    );
}


/* =========================================================
   30. CSV escape
   ========================================================= */

function csvEscape(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";
  }


  let text =
    String(value);


  if (
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n")
  ) {

    text =
      '"' +
      text.replace(
        /"/g,
        '""'
      ) +
      '"';
  }


  return text;
}


/* =========================================================
   31. CSV
   ========================================================= */

function downloadCSV() {

  let csv =
    "";


  /* ---------------------------------------------------------
     基本情報
     --------------------------------------------------------- */

  csv +=
    "===== 基本情報 =====\n";


  csv +=
    "被験者ID," +
    csvEscape(
      participantID
    ) +
    "\n";


  csv +=
    "測定時点コード," +
    selectedTimepoint.code +
    "\n";


  csv +=
    "測定時点," +
    csvEscape(
      selectedTimepoint.name
    ) +
    "\n";


  csv +=
    "使用セット," +
    selectedSetNumber +
    "\n";


  csv +=
    "被験者セット順," +
    csvEscape(
      participantSetOrder
      .join("-")
    ) +
    "\n";


  csv +=
    "実施日時," +
    csvEscape(
      new Date()
      .toLocaleString(
        "ja-JP"
      )
    ) +
    "\n";


  /* ---------------------------------------------------------
     Summary
     --------------------------------------------------------- */

  csv +=
    "\n===== TMT集計結果 =====\n";


  csv +=
    "被験者ID,測定時点,回,Aフォーム,Bフォーム,A時間(秒),B時間(秒),B-A(秒),B/A,Aエラー数,Bエラー数,A離筆回数,B離筆回数,A総描画距離(px),B総描画距離(px),A接触時間(ms),B接触時間(ms),A非接触時間(ms),B非接触時間(ms),A平均描画速度(px/秒),B平均描画速度(px/秒)\n";


  for (
    let rep=1;
    rep<=3;
    rep++
  ) {

    const A =
      getResult(
        "A",
        rep
      );


    const B =
      getResult(
        "B",
        rep
      );


    csv += [

      participantID,

      selectedTimepoint.code,

      rep,

      "A" +
      String(
        A.form_number
      ).padStart(
        2,
        "0"
      ),

      "B" +
      String(
        B.form_number
      ).padStart(
        2,
        "0"
      ),

      format(
        A.completion_sec,
        3
      ),

      format(
        B.completion_sec,
        3
      ),

      format(
        B.completion_sec -
        A.completion_sec,
        3
      ),

      format(
        B.completion_sec /
        A.completion_sec,
        4
      ),

      A.errors,

      B.errors,

      A.pen_lifts,

      B.pen_lifts,

      format(
        A.total_distance_px,
        2
      ),

      format(
        B.total_distance_px,
        2
      ),

      format(
        A.pen_down_ms,
        2
      ),

      format(
        B.pen_down_ms,
        2
      ),

      format(
        A.pause_ms,
        2
      ),

      format(
        B.pause_ms,
        2
      ),

      format(
        A.average_pen_speed_px_sec,
        2
      ),

      format(
        B.average_pen_speed_px_sec,
        2
      )

    ]
    .map(
      csvEscape
    )
    .join(",")
    +
    "\n";
  }


  /* ---------------------------------------------------------
     3回平均
     --------------------------------------------------------- */

  const Aresults =
    results.filter(
      r =>
        r.test ===
        "A"
    );


  const Bresults =
    results.filter(
      r =>
        r.test ===
        "B"
    );


  csv +=
    "\n===== 3回平均 =====\n";


  csv +=
    "指標,平均値\n";


  csv +=
    "TMT-A時間(秒)," +
    format(
      mean(
        Aresults.map(
          r =>
            r.completion_sec
        )
      ),
      3
    )
    +
    "\n";


  csv +=
    "TMT-B時間(秒)," +
    format(
      mean(
        Bresults.map(
          r =>
            r.completion_sec
        )
      ),
      3
    )
    +
    "\n";


  csv +=
    "TMT-Aエラー数," +
    format(
      mean(
        Aresults.map(
          r =>
            r.errors
        )
      ),
      2
    )
    +
    "\n";


  csv +=
    "TMT-Bエラー数," +
    format(
      mean(
        Bresults.map(
          r =>
            r.errors
        )
      ),
      2
    )
    +
    "\n";


  csv +=
    "TMT-A離筆回数," +
    format(
      mean(
        Aresults.map(
          r =>
            r.pen_lifts
        )
      ),
      2
    )
    +
    "\n";


  csv +=
    "TMT-B離筆回数," +
    format(
      mean(
        Bresults.map(
          r =>
            r.pen_lifts
        )
      ),
      2
    )
    +
    "\n";


  csv +=
    "TMT-A平均描画速度," +
    format(
      mean(
        Aresults.map(
          r =>
            r.average_pen_speed_px_sec
        )
      ),
      2
    )
    +
    "\n";


  csv +=
    "TMT-B平均描画速度," +
    format(
      mean(
        Bresults.map(
          r =>
            r.average_pen_speed_px_sec
        )
      ),
      2
    )
    +
    "\n";


  /* ---------------------------------------------------------
     Layout metrics
     --------------------------------------------------------- */

  csv +=
    "\n===== フォーム難易度指標 =====\n";


  csv +=
    "課題,回,フォーム,総経路長,平均step,stepSD,最大step,水平移動量,垂直移動量,交差数\n";


  results.forEach(
    result => {

      const m =
        result.layout_metrics ||
        {};


      csv += [

        "TMT-" +
        result.test,

        result.repetition,

        result.test +
        String(
          result.form_number
        ).padStart(
          2,
          "0"
        ),

        format(
          m.totalLength,
          4
        ),

        format(
          m.meanStep,
          4
        ),

        format(
          m.sdStep,
          4
        ),

        format(
          m.maxStep,
          4
        ),

        format(
          m.totalAbsX,
          4
        ),

        format(
          m.totalAbsY,
          4
        ),

        m.crossings ?? ""

      ]
      .map(
        csvEscape
      )
      .join(",")
      +
      "\n";

    }
  );


  /* ---------------------------------------------------------
     Target arrival
     --------------------------------------------------------- */

  csv +=
    "\n===== ターゲット到達記録 =====\n";


  csv +=
    "被験者ID,測定時点,課題,回,フォーム,到達順,ラベル,到達時間(ms),X座標,Y座標\n";


  results.forEach(
    result => {

      result
      .target_arrivals
      .forEach(
        target => {

          csv += [

            participantID,

            selectedTimepoint.code,

            "TMT-" +
            result.test,

            result.repetition,

            result.test +
            String(
              result.form_number
            ).padStart(
              2,
              "0"
            ),

            target.order,

            target.label,

            format(
              target.elapsed_ms,
              2
            ),

            format(
              target.x,
              2
            ),

            format(
              target.y,
              2
            )

          ]
          .map(
            csvEscape
          )
          .join(",")
          +
          "\n";

        }
      );
    }
  );


  /* ---------------------------------------------------------
     Event
     --------------------------------------------------------- */

  csv +=
    "\n===== イベント記録 =====\n";


  csv +=
    "被験者ID,測定時点,課題,回,フォーム,イベント,経過時間(ms),期待ラベル,接触ラベル,離筆累積回数,再開ラベル\n";


  eventLog.forEach(
    e => {

      csv += [

        participantID,

        selectedTimepoint.code,

        "TMT-" +
        e.test,

        e.repetition,

        e.test +
        String(
          e.form_number
        ).padStart(
          2,
          "0"
        ),

        e.event,

        format(
          e.elapsed_ms,
          2
        ),

        e.expected_label ||
        "",

        e.touched_label ||
        "",

        e.pen_lift_count ||
        "",

        e.resume_label ||
        ""

      ]
      .map(
        csvEscape
      )
      .join(",")
      +
      "\n";
    }
  );


  /* ---------------------------------------------------------
     UTF-8 BOM
     --------------------------------------------------------- */

  const bom =
    new Uint8Array(
      [
        0xEF,
        0xBB,
        0xBF
      ]
    );


  const blob =
    new Blob(
      [
        bom,
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =

    participantID +

    "_" +

    selectedTimepoint.code +

    "_TMT結果.csv";


  document.body
    .appendChild(
      a
    );


  a.click();


  document.body
    .removeChild(
      a
    );


  URL.revokeObjectURL(
    url
  );


  document
    .getElementById(
      "app"
    )
    .innerHTML = `

    <div class="screen">

      <h2>
        終了しました
      </h2>

      <p>
        CSVファイルを
        保存しました。
      </p>

    </div>

    `;
}
