<script>


/* =========================================================
   1. 基本設定
========================================================= */


/*
  2-back
*/
const N_BACK = 2;


/*
  練習20試行
*/
const PRACTICE_TRIALS = 20;


/*
  本試行
  50試行 × 2ブロック
*/
const MAIN_TRIALS_PER_BLOCK = 50;


/*
  各50試行中

  最初の2試行を除く48試行のうち
  15試行をTargetに固定

  15 / 48 = 31.25%
*/
const MAIN_TARGETS_PER_BLOCK = 15;


/*
  練習は5 Target
*/
const PRACTICE_TARGETS = 5;


/*
  刺激提示時間
*/
const STIMULUS_DURATION = 500;


/*
  1試行全体

  刺激 500 ms
  +
  刺激消失後 1500 ms

  = 2000 ms
*/
const TRIAL_DURATION = 2000;


/*
  ブロック間休憩
*/
const BREAK_DURATION = 60000;


/*
  使用する英字
*/
const LETTERS = [

  "B",
  "C",
  "D",
  "F",
  "G",
  "H",
  "J",
  "K",
  "L",
  "M",
  "P",
  "Q",
  "R",
  "S",
  "T"

];


let participant_id = "";


/* =========================================================
   2. 基本統計
========================================================= */


function mean(values) {

  if (
    values.length === 0
  ) {

    return NaN;

  }


  return values.reduce(
    (a,b) => a+b,
    0
  ) / values.length;

}



function median(values) {

  if (
    values.length === 0
  ) {

    return NaN;

  }


  const sorted =
    [...values]
      .sort(
        (a,b) => a-b
      );


  const middle =
    Math.floor(
      sorted.length / 2
    );


  if (
    sorted.length % 2 === 0
  ) {

    return (

      sorted[
        middle - 1
      ]

      +

      sorted[
        middle
      ]

    ) / 2;

  }


  return sorted[
    middle
  ];

}



function standardDeviation(values) {

  if (
    values.length < 2
  ) {

    return NaN;

  }


  const m =
    mean(values);


  const variance =

    values.reduce(

      (sum,x) =>

        sum +

        Math.pow(
          x - m,
          2
        ),

      0

    )

    /

    (
      values.length - 1
    );


  return Math.sqrt(
    variance
  );

}


/* =========================================================
   3. inverse normal CDF
   d-prime計算用

   Acklam approximation
========================================================= */


function normInv(p) {

  if (
    p <= 0 ||
    p >= 1
  ) {

    return NaN;

  }


  const a = [

    -3.969683028665376e+01,
     2.209460984245205e+02,
    -2.759285104469687e+02,
     1.383577518672690e+02,
    -3.066479806614716e+01,
     2.506628277459239e+00

  ];


  const b = [

    -5.447609879822406e+01,
     1.615858368580409e+02,
    -1.556989798598866e+02,
     6.680131188771972e+01,
    -1.328068155288572e+01

  ];


  const c = [

    -7.784894002430293e-03,
    -3.223964580411365e-01,
    -2.400758277161838e+00,
    -2.549732539343734e+00,
     4.374664141464968e+00,
     2.938163982698783e+00

  ];


  const d = [

     7.784695709041462e-03,
     3.224671290700398e-01,
     2.445134137142996e+00,
     3.754408661907416e+00

  ];


  const plow =
    0.02425;


  const phigh =
    1 - plow;


  let q;

  let r;


  if (
    p < plow
  ) {

    q =
      Math.sqrt(
        -2 *
        Math.log(p)
      );


    return (

      (
        (
          (
            (
              (
                c[0] * q
                + c[1]
              ) * q
              + c[2]
            ) * q
            + c[3]
          ) * q
          + c[4]
        ) * q
        + c[5]
      )

      /

      (
        (
          (
            (
              d[0] * q
              + d[1]
            ) * q
            + d[2]
          ) * q
          + d[3]
        ) * q
        + 1
      )

    );

  }


  if (
    p > phigh
  ) {

    q =
      Math.sqrt(
        -2 *
        Math.log(
          1-p
        )
      );


    return -(

      (
        (
          (
            (
              (
                c[0] * q
                + c[1]
              ) * q
              + c[2]
            ) * q
            + c[3]
          ) * q
          + c[4]
        ) * q
        + c[5]
      )

      /

      (
        (
          (
            (
              d[0] * q
              + d[1]
            ) * q
            + d[2]
          ) * q
          + d[3]
        ) * q
        + 1
      )

    );

  }


  q =
    p - 0.5;


  r =
    q * q;


  return (

    (
      (
        (
          (
            (
              a[0] * r
              + a[1]
            ) * r
            + a[2]
          ) * r
          + a[3]
        ) * r
        + a[4]
      ) * r
      + a[5]
    ) * q

    /

    (
      (
        (
          (
            (
              b[0] * r
              + b[1]
            ) * r
            + b[2]
          ) * r
          + b[3]
        ) * r
        + b[4]
      ) * r
      + 1
    )

  );

}


/* =========================================================
   4. Target位置生成
========================================================= */


function makeTargetPositions(
  numTrials,
  targetCount
) {


  /*
    0,1番目は2-back判定できないため
    Targetにはしない
  */

  const possible = [];


  for (
    let i = N_BACK;
    i < numTrials;
    i++
  ) {

    possible.push(i);

  }


  const shuffled =
    jsPsych.randomization
      .shuffle(
        possible
      );


  return new Set(

    shuffled.slice(
      0,
      targetCount
    )

  );

}


/* =========================================================
   5. N-back刺激列生成
========================================================= */


function generateNBackTrials(
  numTrials,
  blockName,
  targetCount
) {


  const trials = [];


  const targetPositions =

    makeTargetPositions(
      numTrials,
      targetCount
    );


  for (
    let i = 0;
    i < numTrials;
    i++
  ) {


    let stimulus;


    let isTarget =
      false;


    const validNBackTrial =
      i >= N_BACK;


    /* -----------------------------------------------------
       最初の2試行

       2-back判定不能
    ----------------------------------------------------- */

    if (
      !validNBackTrial
    ) {


      stimulus =

        jsPsych.randomization
          .sampleWithoutReplacement(
            LETTERS,
            1
          )[0];

    }


    /* -----------------------------------------------------
       Target
    ----------------------------------------------------- */

    else if (
      targetPositions.has(i)
    ) {


      stimulus =
        trials[
          i - N_BACK
        ].stimulus;


      isTarget =
        true;

    }


    /* -----------------------------------------------------
       Non-target

       2つ前と同じ文字になることを防ぐ
    ----------------------------------------------------- */

    else {


      const forbidden =

        trials[
          i - N_BACK
        ].stimulus;


      const candidates =

        LETTERS.filter(

          letter =>
            letter !==
            forbidden

        );


      stimulus =

        jsPsych.randomization
          .sampleWithoutReplacement(
            candidates,
            1
          )[0];


      isTarget =
        false;

    }


    trials.push({

      stimulus:
        stimulus,

      block:
        blockName,

      trial_number:
        i + 1,

      valid_nback_trial:
        validNBackTrial,

      is_target:
        isTarget,

      correct_response:

        validNBackTrial

        ?

        (
          isTarget
          ?
          "j"
          :
          "f"
        )

        :

        null

    });

  }


  return trials;

}


/* =========================================================
   6. N-back Trial作成
========================================================= */


function createNBackBlock(
  trials
) {


  const timeline =
    [];


  trials.forEach(
    trial => {


      timeline.push({


        type:
          jsPsychHtmlKeyboardResponse,


        stimulus:

          `<div class="stimulus">
             ${trial.stimulus}
           </div>`,


        /*
          最初の2試行では
          回答させない
        */

        choices:

          trial.valid_nback_trial

          ?

          ["f","j"]

          :

          "NO_KEYS",


        /*
          Trialは2000 ms継続
        */

        trial_duration:
          TRIAL_DURATION,


        /*
          文字だけ500 msで消える

          その後1500 msは空白だが
          F/J回答は可能
        */

        stimulus_duration:
          STIMULUS_DURATION,


        /*
          キーを押しても
          Trial時間は短縮しない
        */

        response_ends_trial:
          false,


        data: {


          task:
            "nback",


          phase:

            trial.block ===
            "practice"

            ?

            "practice"

            :

            "main",


          block:
            trial.block,


          trial_number:
            trial.trial_number,


          stimulus:
            trial.stimulus,


          valid_nback_trial:
            trial.valid_nback_trial,


          is_target:
            trial.is_target,


          correct_response:
            trial.correct_response

        },


        on_finish:
        function(data) {


          /* ------------------------------------------------
             最初の2試行
          ------------------------------------------------ */

          if (
            !data.valid_nback_trial
          ) {


            data.correct =
              null;


            data.response_type =
              "initial";


            data.no_response =
              true;


            return;

          }


          const responseJ =

            jsPsych.pluginAPI
              .compareKeys(
                data.response,
                "j"
              );


          const responseF =

            jsPsych.pluginAPI
              .compareKeys(
                data.response,
                "f"
              );


          data.no_response =
            data.response === null;


          /* ------------------------------------------------
             Target
          ------------------------------------------------ */

          if (
            data.is_target
          ) {


            if (
              responseJ
            ) {


              data.correct =
                true;


              data.response_type =
                "hit";

            }


            else {


              /*
                Fまたは無反応
                → Miss
              */

              data.correct =
                false;


              data.response_type =
                "miss";

            }

          }


          /* ------------------------------------------------
             Non-target
          ------------------------------------------------ */

          else {


            if (
              responseF
            ) {


              data.correct =
                true;


              data.response_type =
                "correct_rejection";

            }


            else if (
              responseJ
            ) {


              data.correct =
                false;


              data.response_type =
                "false_alarm";

            }


            else {


              /*
                Non-targetへの無反応

                False Alarmとは別に保存
              */

              data.correct =
                false;


              data.response_type =
                "no_response";

            }

          }

        }

      });

    }
  );


  return timeline;

}


/* =========================================================
   7. N-back集計
========================================================= */


function calculateNBackResults(
  blockName = null
) {


  let data =

    jsPsych.data
      .get()
      .filter({
        task:
          "nback",
        phase:
          "main"
      })
      .values();


  if (
    blockName !== null
  ) {


    data =
      data.filter(
        d =>
          d.block ===
          blockName
      );

  }


  /* -------------------------------------------------------
     最初の2試行を解析から除外
  ------------------------------------------------------- */

  const valid =

    data.filter(
      d =>
        d.valid_nback_trial ===
        true
    );


  const targets =

    valid.filter(
      d =>
        d.is_target ===
        true
    );


  const nontargets =

    valid.filter(
      d =>
        d.is_target ===
        false
    );


  /* -------------------------------------------------------
     Counts
  ------------------------------------------------------- */

  const hit =

    targets.filter(
      d =>
        d.response_type ===
        "hit"
    ).length;


  const miss =

    targets.filter(
      d =>
        d.response_type ===
        "miss"
    ).length;


  const correctRejection =

    nontargets.filter(
      d =>
        d.response_type ===
        "correct_rejection"
    ).length;


  const falseAlarm =

    nontargets.filter(
      d =>
        d.response_type ===
        "false_alarm"
    ).length;


  const noResponse =

    valid.filter(
      d =>
        d.no_response ===
        true
    ).length;


  const nontargetNoResponse =

    nontargets.filter(
      d =>
        d.response_type ===
        "no_response"
    ).length;


  /* -------------------------------------------------------
     Accuracy
  ------------------------------------------------------- */

  const correctCount =
    hit +
    correctRejection;


  const accuracy =

    valid.length > 0

    ?

    correctCount /
    valid.length

    :

    NaN;


  /* -------------------------------------------------------
     Rates
  ------------------------------------------------------- */

  const hitRate =

    targets.length > 0

    ?

    hit /
    targets.length

    :

    NaN;


  const missRate =

    targets.length > 0

    ?

    miss /
    targets.length

    :

    NaN;


  const correctRejectionRate =

    nontargets.length > 0

    ?

    correctRejection /
    nontargets.length

    :

    NaN;


  const falseAlarmRate =

    nontargets.length > 0

    ?

    falseAlarm /
    nontargets.length

    :

    NaN;


  /* =======================================================
     d-prime

     extreme value correction:

     Hit rate = 1
       → 1 - 0.5/Ntarget

     Hit rate = 0
       → 0.5/Ntarget

     FA rate = 1
       → 1 - 0.5/Nnontarget

     FA rate = 0
       → 0.5/Nnontarget
  ======================================================= */


  let correctedHitRate =
    hitRate;


  let correctedFARate =
    falseAlarmRate;


  if (
    targets.length > 0
  ) {


    if (
      correctedHitRate === 1
    ) {


      correctedHitRate =

        1 -

        (
          0.5 /
          targets.length
        );

    }


    else if (
      correctedHitRate === 0
    ) {


      correctedHitRate =

        0.5 /
        targets.length;

    }

  }


  if (
    nontargets.length > 0
  ) {


    if (
      correctedFARate === 1
    ) {


      correctedFARate =

        1 -

        (
          0.5 /
          nontargets.length
        );

    }


    else if (
      correctedFARate === 0
    ) {


      correctedFARate =

        0.5 /
        nontargets.length;

    }

  }


  let dprime =
    NaN;


  if (

    Number.isFinite(
      correctedHitRate
    )

    &&

    Number.isFinite(
      correctedFARate
    )

  ) {


    dprime =

      normInv(
        correctedHitRate
      )

      -

      normInv(
        correctedFARate
      );

  }


  /* =======================================================
     Reaction Time
  ======================================================= */


  /*
    正答試行
  */

  const correctRTs =

    valid

      .filter(

        d =>
          d.correct === true
          &&
          d.rt !== null

      )

      .map(
        d =>
          d.rt
      );


  /*
    Hit RT
  */

  const hitRTs =

    targets

      .filter(

        d =>
          d.response_type ===
          "hit"
          &&
          d.rt !== null

      )

      .map(
        d =>
          d.rt
      );


  /*
    Correct Rejection RT
  */

  const correctRejectionRTs =

    nontargets

      .filter(

        d =>
          d.response_type ===
          "correct_rejection"
          &&
          d.rt !== null

      )

      .map(
        d =>
          d.rt
      );


  /* -------------------------------------------------------
     Results
  ------------------------------------------------------- */

  return {


    total_trials:
      valid.length,


    correct_count:
      correctCount,


    accuracy:
      accuracy,


    target_count:
      targets.length,


    hit_count:
      hit,


    miss_count:
      miss,


    hit_rate:
      hitRate,


    miss_rate:
      missRate,


    nontarget_count:
      nontargets.length,


    correct_rejection_count:
      correctRejection,


    false_alarm_count:
      falseAlarm,


    correct_rejection_rate:
      correctRejectionRate,


    false_alarm_rate:
      falseAlarmRate,


    no_response_count:
      noResponse,


    nontarget_no_response_count:
      nontargetNoResponse,


    corrected_hit_rate:
      correctedHitRate,


    corrected_false_alarm_rate:
      correctedFARate,


    dprime:
      dprime,


    mean_correct_rt:
      mean(
        correctRTs
      ),


    median_correct_rt:
      median(
        correctRTs
      ),


    mean_hit_rt:
      mean(
        hitRTs
      ),


    mean_correct_rejection_rt:
      mean(
        correctRejectionRTs
      ),


    sd_correct_rt:
      standardDeviation(
        correctRTs
      ),


    sd_hit_rt:
      standardDeviation(
        hitRTs
      ),


    sd_correct_rejection_rt:
      standardDeviation(
        correctRejectionRTs
      )

  };

}


/* =========================================================
   8. 表示関数
========================================================= */


function format(
  value,
  digits = 1
) {


  if (
    !Number.isFinite(
      value
    )
  ) {

    return "";

  }


  return Number(
    value
  ).toFixed(
    digits
  );

}


/* =========================================================
   9. jsPsych初期化
========================================================= */


const jsPsych =
  initJsPsych({


    on_finish:
    function() {


      const block1 =

        calculateNBackResults(
          "main1"
        );


      const block2 =

        calculateNBackResults(
          "main2"
        );


      const overall =

        calculateNBackResults();


      /* ===================================================
         CSV
      =================================================== */


      let csv = "";


      /* ---------------------------------------------------
         基本情報
      --------------------------------------------------- */

      csv +=
        "===== 基本情報 =====\n";


      csv +=
        "被験者ID," +
        participant_id +
        "\n";


      csv +=
        "課題,2-back\n";


      csv +=
        "刺激提示時間(ms)," +
        STIMULUS_DURATION +
        "\n";


      csv +=
        "1試行時間(ms)," +
        TRIAL_DURATION +
        "\n";


      csv +=
        "本試行1試行数," +
        MAIN_TRIALS_PER_BLOCK +
        "\n";


      csv +=
        "本試行2試行数," +
        MAIN_TRIALS_PER_BLOCK +
        "\n";


      csv +=
        "各Block Target数," +
        MAIN_TARGETS_PER_BLOCK +
        "\n";


      csv +=
        "実施日時," +
        new Date()
          .toLocaleString(
            "ja-JP"
          )
        +
        "\n";


      /* ---------------------------------------------------
         Raw data
      --------------------------------------------------- */

      csv +=
        "\n===== Trial level data =====\n";


      csv +=
        "被験者ID,phase,block,trial_number,stimulus,valid_nback_trial,is_target,correct_response,response,response_type,correct,no_response,rt_ms\n";


      const rawData =

        jsPsych.data
          .get()
          .filter({
            task:
              "nback"
          })
          .values();


      rawData.forEach(
        d => {


          csv += [

            participant_id,

            d.phase,

            d.block,

            d.trial_number,

            d.stimulus,

            d.valid_nback_trial,

            d.is_target,

            d.correct_response ?? "",

            d.response ?? "",

            d.response_type ?? "",

            d.correct ?? "",

            d.no_response ?? "",

            d.rt ?? ""

          ].join(",")
          +
          "\n";

        }
      );


      /* ===================================================
         Summary追加
      =================================================== */


      function addSummary(
        label,
        r
      ) {


        csv +=
          "\n===== " +
          label +
          " =====\n";


        csv +=
          "総試行数," +
          r.total_trials +
          "\n";


        csv +=
          "正答数," +
          r.correct_count +
          "\n";


        csv +=
          "正答率(%)," +
          format(
            r.accuracy * 100,
            1
          )
          +
          "\n";


        csv +=
          "Target数," +
          r.target_count +
          "\n";


        csv +=
          "Hit数," +
          r.hit_count +
          "\n";


        csv +=
          "Miss数," +
          r.miss_count +
          "\n";


        csv +=
          "Hit rate(%)," +
          format(
            r.hit_rate * 100,
            1
          )
          +
          "\n";


        csv +=
          "Miss rate(%)," +
          format(
            r.miss_rate * 100,
            1
          )
          +
          "\n";


        csv +=
          "Non-target数," +
          r.nontarget_count +
          "\n";


        csv +=
          "Correct Rejection数," +
          r.correct_rejection_count +
          "\n";


        csv +=
          "False Alarm数," +
          r.false_alarm_count +
          "\n";


        csv +=
          "Correct Rejection rate(%)," +
          format(
            r.correct_rejection_rate * 100,
            1
          )
          +
          "\n";


        csv +=
          "False Alarm rate(%)," +
          format(
            r.false_alarm_rate * 100,
            1
          )
          +
          "\n";


        csv +=
          "無反応数," +
          r.no_response_count +
          "\n";


        csv +=
          "d-prime," +
          format(
            r.dprime,
            3
          )
          +
          "\n";


        csv +=
          "正答時平均RT(ms)," +
          format(
            r.mean_correct_rt,
            1
          )
          +
          "\n";


        csv +=
          "正答時中央値RT(ms)," +
          format(
            r.median_correct_rt,
            1
          )
          +
          "\n";


        csv +=
          "Hit平均RT(ms)," +
          format(
            r.mean_hit_rt,
            1
          )
          +
          "\n";


        csv +=
          "Correct Rejection平均RT(ms)," +
          format(
            r.mean_correct_rejection_rt,
            1
          )
          +
          "\n";


        csv +=
          "RT標準偏差(ms)," +
          format(
            r.sd_correct_rt,
            1
          )
          +
          "\n";


        /*
          削除する必要はないので
          trial-type別SDもCSVには保存
        */

        csv +=
          "Hit RT標準偏差(ms)," +
          format(
            r.sd_hit_rt,
            1
          )
          +
          "\n";


        csv +=
          "Correct Rejection RT標準偏差(ms)," +
          format(
            r.sd_correct_rejection_rt,
            1
          )
          +
          "\n";


        /*
          d′計算に使用した補正値も保存
        */

        csv +=
          "d-prime補正後Hit rate," +
          format(
            r.corrected_hit_rate,
            4
          )
          +
          "\n";


        csv +=
          "d-prime補正後False Alarm rate," +
          format(
            r.corrected_false_alarm_rate,
            4
          )
          +
          "\n";

      }


      addSummary(
        "本試行1",
        block1
      );


      addSummary(
        "本試行2",
        block2
      );


      addSummary(
        "本試行全体",
        overall
      );


      /* ===================================================
         CSV保存
      =================================================== */


      const bom =

        new Uint8Array([
          0xEF,
          0xBB,
          0xBF
        ]);


      const blob =

        new Blob(

          [
            bom,
            csv
          ],

          {
            type:
              "text/csv;charset=utf-8;"
          }

        );


      const url =

        URL.createObjectURL(
          blob
        );


      const link =

        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =

        "nback_" +

        participant_id +

        "_" +

        new Date()
          .toISOString()
          .slice(
            0,
            10
          )

        +

        ".csv";


      document.body
        .appendChild(
          link
        );


      link.click();


      document.body
        .removeChild(
          link
        );


      URL.revokeObjectURL(
        url
      );

    }

  });
