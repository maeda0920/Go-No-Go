/* =========================================================
   1. 基本設定
========================================================= */

const N_BACK = 2;

const PRACTICE_TRIALS = 20;

const MAIN_TRIALS_PER_BLOCK = 50;

const MAIN_TARGETS_PER_BLOCK = 15;

const PRACTICE_TARGETS = 5;

const STIMULUS_DURATION = 500;

const TRIAL_DURATION = 2000;

const BREAK_DURATION = 60000;

const LETTERS = [
  "B","C","D","F","G",
  "H","J","K","L","M",
  "P","Q","R","S","T"
];


/* =========================================================
   2. 測定時点
========================================================= */

const TIMEPOINTS = [

  {
    code: "T1",
    ja: "介入前 Baseline",
    en: "Pre-intervention Baseline"
  },

  {
    code: "T2",
    ja: "介入4週間後",
    en: "Week 4 of Intervention"
  },

  {
    code: "T3",
    ja: "介入8週間後",
    en: "Week 8 of Intervention"
  },

  {
    code: "T4",
    ja: "Washout後 Baseline",
    en: "Post-washout Baseline"
  },

  {
    code: "T5",
    ja: "Washout後4週間後",
    en: "Week 4 After Post-washout Baseline"
  },

  {
    code: "T6",
    ja: "Washout後8週間後",
    en: "Week 8 After Post-washout Baseline"
  }

];


/* =========================================================
   3. 被験者情報
========================================================= */

let language = "ja";

let participant_id = "";

let selectedTimepointIndex = 0;

let selectedTimepoint = null;

let experiment_date = "";


/* =========================================================
   4. 言語切替
========================================================= */

function t(ja, en) {

  return language === "en"
    ? en
    : ja;
}


function timepointName(tp) {

  return language === "en"
    ? tp.en
    : tp.ja;
}


/* =========================================================
   5. 基本統計
========================================================= */

function mean(values) {

  if (values.length === 0) {
    return NaN;
  }

  return values.reduce(
    (a,b) => a+b,
    0
  ) / values.length;
}


function median(values) {

  if (values.length === 0) {
    return NaN;
  }

  const sorted =
    [...values].sort(
      (a,b) => a-b
    );

  const middle =
    Math.floor(
      sorted.length / 2
    );

  if (sorted.length % 2 === 0) {

    return (
      sorted[middle - 1]
      +
      sorted[middle]
    ) / 2;
  }

  return sorted[middle];
}


function standardDeviation(values) {

  if (values.length < 2) {
    return NaN;
  }

  const m =
    mean(values);

  return Math.sqrt(

    values.reduce(
      (sum,x) =>
        sum +
        Math.pow(
          x-m,
          2
        ),
      0
    )

    /

    (values.length-1)

  );
}


function format(
  value,
  digits = 1
) {

  if (
    !Number.isFinite(
      value
    )
  ) {

    return "";
  }

  return Number(value)
    .toFixed(
      digits
    );
}


/* =========================================================
   6. inverse normal CDF
   d-prime計算用
========================================================= */

function normInv(p) {

  if (
    p <= 0 ||
    p >= 1
  ) {
    return NaN;
  }

  const a = [
    -3.969683028665376e+01,
     2.209460984245205e+02,
    -2.759285104469687e+02,
     1.383577518672690e+02,
    -3.066479806614716e+01,
     2.506628277459239e+00
  ];

  const b = [
    -5.447609879822406e+01,
     1.615858368580409e+02,
    -1.556989798598866e+02,
     6.680131188771972e+01,
    -1.328068155288572e+01
  ];

  const c = [
    -7.784894002430293e-03,
    -3.223964580411365e-01,
    -2.400758277161838e+00,
    -2.549732539343734e+00,
     4.374664141464968e+00,
     2.938163982698783e+00
  ];

  const d = [
     7.784695709041462e-03,
     3.224671290700398e-01,
     2.445134137142996e+00,
     3.754408661907416e+00
  ];

  const plow = 0.02425;

  const phigh =
    1 - plow;

  let q;

  let r;


  if (
    p < plow
  ) {

    q =
      Math.sqrt(
        -2 *
        Math.log(p)
      );

    return (
      (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])
      /
      ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)
    );
  }


  if (
    p > phigh
  ) {

    q =
      Math.sqrt(
        -2 *
        Math.log(1-p)
      );

    return -(
      (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])
      /
      ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)
    );
  }


  q =
    p - 0.5;

  r =
    q*q;


  return (
    (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q
    /
    (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)
  );

}


/* =========================================================
   7. Target位置生成
========================================================= */

function makeTargetPositions(
  numTrials,
  targetCount
) {

  const possible = [];


  /*
    最初の2試行は
    2-back判定対象外
  */

  for (
    let i = N_BACK;
    i < numTrials;
    i++
  ) {

    possible.push(i);
  }


  const shuffled =
    jsPsych.randomization.shuffle(
      possible
    );


  return new Set(
    shuffled.slice(
      0,
      targetCount
    )
  );

}


/* =========================================================
   8. 刺激列生成
========================================================= */

function generateNBackTrials(
  numTrials,
  blockName,
  targetCount
) {

  const trials = [];


  const targetPositions =
    makeTargetPositions(
      numTrials,
      targetCount
    );


  for (
    let i = 0;
    i < numTrials;
    i++
  ) {

    let stimulus;

    let isTarget =
      false;


    const validNBackTrial =
      i >= N_BACK;


    /* -----------------------------------------------------
       最初の2試行
    ----------------------------------------------------- */

    if (
      !validNBackTrial
    ) {

      stimulus =
        jsPsych.randomization
          .sampleWithoutReplacement(
            LETTERS,
            1
          )[0];

    }


    /* -----------------------------------------------------
       Target
    ----------------------------------------------------- */

    else if (
      targetPositions.has(i)
    ) {

      stimulus =
        trials[
          i-N_BACK
        ].stimulus;


      isTarget =
        true;

    }


    /* -----------------------------------------------------
       Non-target
    ----------------------------------------------------- */

    else {

      const forbidden =
        trials[
          i-N_BACK
        ].stimulus;


      const candidates =
        LETTERS.filter(
          letter =>
            letter !== forbidden
        );


      stimulus =
        jsPsych.randomization
          .sampleWithoutReplacement(
            candidates,
            1
          )[0];


      isTarget =
        false;

    }


    trials.push({

      stimulus:
        stimulus,

      block:
        blockName,

      trial_number:
        i+1,

      valid_nback_trial:
        validNBackTrial,

      is_target:
        isTarget,

      correct_response:

        validNBackTrial

        ?

        (
          isTarget
          ?
          "j"
          :
          "f"
        )

        :

        null

    });

  }


  return trials;

}


/* =========================================================
   9. N-back Trial作成
========================================================= */

function createNBackBlock(
  trials
) {

  const blockTimeline = [];


  trials.forEach(
    trial => {


      blockTimeline.push({

        type:
          jsPsychHtmlKeyboardResponse,


        stimulus:

          `<div class="stimulus">
             ${trial.stimulus}
           </div>`,


        /*
          最初の2試行では回答しない
        */

        choices:

          trial.valid_nback_trial

          ?

          ["f","j"]

          :

          "NO_KEYS",


        /*
          1試行2000 ms
        */

        trial_duration:
          TRIAL_DURATION,


        /*
          文字は500 msで消える
        */

        stimulus_duration:
          STIMULUS_DURATION,


        /*
          回答してもTrialは短縮しない
        */

        response_ends_trial:
          false,


        data: {

          task:
            "nback",

          phase:

            trial.block === "practice"

            ?

            "practice"

            :

            "main",

          block:
            trial.block,

          trial_number:
            trial.trial_number,

          stimulus:
            trial.stimulus,

          valid_nback_trial:
            trial.valid_nback_trial,

          is_target:
            trial.is_target,

          correct_response:
            trial.correct_response

        },


        on_finish:
        function(data) {


          if (
            !data.valid_nback_trial
          ) {

            data.correct =
              null;

            data.response_type =
              "initial";

            data.no_response =
              true;

            return;
          }


          const responseJ =
            jsPsych.pluginAPI
              .compareKeys(
                data.response,
                "j"
              );


          const responseF =
            jsPsych.pluginAPI
              .compareKeys(
                data.response,
                "f"
              );


          data.no_response =
            data.response === null;


          /* ------------------------------------------------
             Target
          ------------------------------------------------ */

          if (
            data.is_target
          ) {

            if (
              responseJ
            ) {

              data.correct =
                true;

              data.response_type =
                "hit";

            }

            else {

              data.correct =
                false;

              data.response_type =
                "miss";

            }

          }


          /* ------------------------------------------------
             Non-target
          ------------------------------------------------ */

          else {

            if (
              responseF
            ) {

              data.correct =
                true;

              data.response_type =
                "correct_rejection";

            }

            else if (
              responseJ
            ) {

              data.correct =
                false;

              data.response_type =
                "false_alarm";

            }

            else {

              data.correct =
                false;

              data.response_type =
                "no_response";

            }

          }

        }

      });

    }

  );


  return blockTimeline;

}


/* =========================================================
   10. 結果集計
========================================================= */

function calculateNBackResults(
  blockName = null
) {


  let data =

    jsPsych.data
      .get()
      .filter({
        task:
          "nback",
        phase:
          "main"
      })
      .values();


  if (
    blockName !== null
  ) {

    data =
      data.filter(
        d =>
          d.block === blockName
      );

  }


  /*
    各Block最初の2試行を
    解析対象外とする
  */

  const valid =
    data.filter(
      d =>
        d.valid_nback_trial === true
    );


  const targets =
    valid.filter(
      d =>
        d.is_target === true
    );


  const nontargets =
    valid.filter(
      d =>
        d.is_target === false
    );


  /* =======================================================
     Counts
  ======================================================= */

  const hit =
    targets.filter(
      d =>
        d.response_type === "hit"
    ).length;


  const miss =
    targets.filter(
      d =>
        d.response_type === "miss"
    ).length;


  const correctRejection =
    nontargets.filter(
      d =>
        d.response_type ===
        "correct_rejection"
    ).length;


  const falseAlarm =
    nontargets.filter(
      d =>
        d.response_type ===
        "false_alarm"
    ).length;


  const noResponse =
    valid.filter(
      d =>
        d.no_response === true
    ).length;


  const nontargetNoResponse =
    nontargets.filter(
      d =>
        d.response_type ===
        "no_response"
    ).length;


  const correctCount =
    hit +
    correctRejection;


  /* =======================================================
     Accuracy
  ======================================================= */

  const accuracy =

    valid.length > 0

    ?

    correctCount /
    valid.length

    :

    NaN;


  /* =======================================================
     Rates
  ======================================================= */

  const hitRate =

    targets.length > 0

    ?

    hit /
    targets.length

    :

    NaN;


  const missRate =

    targets.length > 0

    ?

    miss /
    targets.length

    :

    NaN;


  const correctRejectionRate =

    nontargets.length > 0

    ?

    correctRejection /
    nontargets.length

    :

    NaN;


  const falseAlarmRate =

    nontargets.length > 0

    ?

    falseAlarm /
    nontargets.length

    :

    NaN;


  /* =======================================================
     d-prime
  ======================================================= */

  let correctedHitRate =
    hitRate;


  let correctedFARate =
    falseAlarmRate;


  if (
    targets.length > 0
  ) {

    if (
      correctedHitRate === 1
    ) {

      correctedHitRate =

        1 -

        (
          0.5 /
          targets.length
        );

    }

    else if (
      correctedHitRate === 0
    ) {

      correctedHitRate =

        0.5 /
        targets.length;

    }

  }


  if (
    nontargets.length > 0
  ) {

    if (
      correctedFARate === 1
    ) {

      correctedFARate =

        1 -

        (
          0.5 /
          nontargets.length
        );

    }

    else if (
      correctedFARate === 0
    ) {

      correctedFARate =

        0.5 /
        nontargets.length;

    }

  }


  let dprime =
    NaN;


  if (

    Number.isFinite(
      correctedHitRate
    )

    &&

    Number.isFinite(
      correctedFARate
    )

  ) {

    dprime =

      normInv(
        correctedHitRate
      )

      -

      normInv(
        correctedFARate
      );

  }


  /* =======================================================
     Reaction Time
  ======================================================= */

  const correctRTs =

    valid

      .filter(

        d =>
          d.correct === true
          &&
          d.rt !== null

      )

      .map(
        d => d.rt
      );


  const hitRTs =

    targets

      .filter(

        d =>
          d.response_type ===
          "hit"
          &&
          d.rt !== null

      )

      .map(
        d => d.rt
      );


  const correctRejectionRTs =

    nontargets

      .filter(

        d =>
          d.response_type ===
          "correct_rejection"
          &&
          d.rt !== null

      )

      .map(
        d => d.rt
      );


  return {

    total_trials:
      valid.length,

    correct_count:
      correctCount,

    accuracy:
      accuracy,

    target_count:
      targets.length,

    hit_count:
      hit,

    miss_count:
      miss,

    hit_rate:
      hitRate,

    miss_rate:
      missRate,

    nontarget_count:
      nontargets.length,

    correct_rejection_count:
      correctRejection,

    false_alarm_count:
      falseAlarm,

    correct_rejection_rate:
      correctRejectionRate,

    false_alarm_rate:
      falseAlarmRate,

    no_response_count:
      noResponse,

    nontarget_no_response_count:
      nontargetNoResponse,

    corrected_hit_rate:
      correctedHitRate,

    corrected_false_alarm_rate:
      correctedFARate,

    dprime:
      dprime,

    mean_correct_rt:
      mean(
        correctRTs
      ),

    median_correct_rt:
      median(
        correctRTs
      ),

    mean_hit_rt:
      mean(
        hitRTs
      ),

    mean_correct_rejection_rt:
      mean(
        correctRejectionRTs
      ),

    sd_correct_rt:
      standardDeviation(
        correctRTs
      ),

    sd_hit_rt:
      standardDeviation(
        hitRTs
      ),

    sd_correct_rejection_rt:
      standardDeviation(
        correctRejectionRTs
      )

  };

}


/* =========================================================
   11. CSV escape
========================================================= */

function csvEscape(value) {

  if (
    value === null
    ||
    value === undefined
  ) {

    return "";
  }


  const text =
    String(value);


  if (
    text.includes(",")
    ||
    text.includes('"')
    ||
    text.includes("\n")
  ) {

    return (
      '"'
      +
      text.replace(
        /"/g,
        '""'
      )
      +
      '"'
    );
  }


  return text;
}

      );

        "Overall Main Task",

      );


      /* ===================================================

      =================================================== */

      const bom =
        new Uint8Array([
          0xEF,
          0xBB,
          0xBF
        ]);


      const blob =
        new Blob(
          [
            bom,
            csv
          ],
          {
            type:

          }
        );

        .removeChild(

        );

        url
      );
